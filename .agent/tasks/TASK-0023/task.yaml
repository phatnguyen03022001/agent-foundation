    - "Self-dogfood the accepted T1-T5 model on current agent-foundation: resolve the ten-step Architect read protocol from fresh target-owned evidence; validate schema-3 product state; recompute current feature states/system aggregates/phase/blocker; prove stored phase equals derived P0_SCOPE and earliest blocker equals release.status."
    - "Prove current agent-foundation product truth remains F001 VERIFIED, F002 INTEGRATED, F003 VERIFIED, F004 INTEGRATED; release remains OPEN/null/UNKNOWN; later feature/system work cannot bypass the P0 release.status blocker."
    - "Bind agent-runtime read-only to exact main SHA 57c046da9e734abe7921f5969f9d85469bad1de2. Before the pilot require local HEAD == origin/main == freshly resolved remote main, ahead/behind 0/0, clean index/worktree, and no active mutation/rebase/merge operation. If the target does not satisfy this exact state, stop BLOCKED; do not fetch-forward, reset, clean, stash, checkout, or reconcile it."
    - "Capture a bounded pre-pilot agent-runtime fingerprint including exact Git identity, porcelain state, tag identities v0.5.1 and v0.5.0, current source version SSOT, minimum target-native product/release/toolchain/verifier/recovery surfaces, and read-only installed Runtime capability identity."
    - "Reconstruct agent-runtime filename-neutrally using current target-native evidence rather than Foundation conventions. At minimum distinguish: current source main 57c046da... with source version 0.5.1; public release v0.5.1 bound to packaged source 674095e... and archive SHA-256 9518e1cf...; installed Runtime identity observed read-only as 0.5.0/b1879b5c... unless fresh evidence proves task staleness; repository task/review state; repo-native verify/package/install/recovery contracts."
    - "Prove no state-layer collapse: source main is not treated as packaged-source identity; public release is not treated as installed Runtime state; installed Runtime capability state is not product/task authority; task/report/review state does not manufacture product feature/gate/phase truth; chat/UI state has authority NONE."
    - "Apply the accepted T5 read protocol to agent-runtime. Resolve every material fact that target-native evidence supports, but do not invent an agent-foundation-style feature registry, global gate matrix, schema-3 state, required release feature set, or project phase for agent-runtime when current target evidence does not canonically establish those facts. Preserve UNKNOWN / actual authority gap rather than fabricating progression."
    - "The foreign-target pilot must explicitly prove that absence of canonical product-state evidence is a valid fail-closed result, not a reason to infer progress from v0.5.1 publication, TASK-0185 acceptance, README wording, current source version, or installed Runtime health."
    - "Inspect current agent-runtime target-native verifier and recovery authority read-only: verify ./verify / verification_policy.py / verify_tests.py and relevant tests remain target-owned; inspect docs/RECOVERY.md and durable execution surfaces sufficiently to prove outcome-unknown/no-blind-retry semantics remain target-native and Foundation does not replace them."
    - "Resolve one exact-pinned Foundation external generic HOW capability from existing metadata and prove it remains subordinate to agent-runtime target-native product/tool/verifier/recovery truth. Do not install, update, or configure ECC or another harness."
    - "Use adversarial historical evidence without replaying mutating work: demonstrate at least one accepted task does not by itself imply live/product completion, one BLOCKED task does not imply product failure, and public release evidence remains separable from incomplete/missing current task report/review evidence."
    - "Immediately after the agent-runtime pilot, freshly resolve remote main again and require exact same bound SHA 57c046da..., ahead/behind 0/0, clean index/worktree, unchanged tag identities, and unchanged installed Runtime read-only identity. Any drift or overlapping writer invalidates the closure interval and requires BLOCKED without reconciliation."
    - "Run fresh Foundation qualification to prove no regression since T5: task artifact validation; current product-state validation; focused T2-T5 regressions; full skills/protocol validator/regressions; external capability sync/regressions; profile bootstrap local/remote/regressions; documents tests; standards verifier using an already-installed qualified interpreter; Python compile where applicable; protected/history identity checks; internal links if touched; git diff --check."
    - "Prove all Foundation paths outside .agent/tasks/TASK-0023/report.yaml remain byte-identical to the exact execution base before report authorship. Prove agent-runtime suffered zero repository, index, ref, tag, release, dependency, process/service, config, tunnel, credential, host-security, install/cutover, or live Runtime mutation caused by TASK-0023."
    - "On complete PASS create only .agent/tasks/TASK-0023/report.yaml with result NEEDS_REVIEW, final_execution_head equal to the exact unchanged TASK-0023 execution base, commit it as the sole report-only child, and publish by ordinary non-force fast-forward after fresh Foundation remote reconciliation."
    - "On any material failure create the same report path with result BLOCKED and exact evidence when publication remains authorized/capable; do not modify Foundation or agent-runtime to make closure pass."
    - "Executor must not declare program/vision closure. Only independent Architect review of the exact T6 report may terminally accept T6."

