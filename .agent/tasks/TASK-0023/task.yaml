acceptance_criteria:
  - id: AC-1
    requirement: "Agent-foundation self-dogfoods the full accepted T1-T5 product-state/progression model deterministically."
    evidence_required: "Fresh ten-step read reconstruction validates target-owned schema-3 state, exact F001-F004 states, system aggregates, stored-vs-derived phase, and earliest blocker P0_SCOPE/release.status with no later-work bypass."

  - id: AC-2
    requirement: "A distinct real target is consumed filename-neutrally without importing Foundation product-state assumptions."
    evidence_required: "Exact stable agent-runtime SHA plus current target-native source/release/toolchain/verifier/recovery evidence are reconstructed read-only; unsupported feature/global-gate/phase facts remain UNKNOWN/authority gap rather than fabricated."

  - id: AC-3
    requirement: "State-layer and ownership boundaries survive adversarial real-target facts."
    evidence_required: "Proof distinguishes source main, packaged-source tag, public release assets, installed Runtime identity, task/review lifecycle, execution/runtime state, and UI/chat authority; no layer is used to manufacture another."

  - id: AC-4
    requirement: "Task/product and release/install separation are demonstrated from real evidence."
    evidence_required: "At least one accepted task is shown not to imply live/product completion; one BLOCKED task is shown not to imply product failure; v0.5.1 public release is shown not to imply installed Runtime v0.5.1; missing/incomplete task lifecycle does not erase independently observable release truth."

  - id: AC-5
    requirement: "Target-native verifier/recovery authority and no-blind-retry semantics remain primary."
    evidence_required: "Agent-runtime verifier/recovery surfaces are resolved from current target bytes; exact-pinned external generic HOW remains authority NONE/subordinate; no Foundation generic HOW replaces target commands or recovery semantics."

  - id: AC-6
    requirement: "Both closure pilots are interference-free and side-effect-free."
    evidence_required: "Foundation remains exact execution base before report; agent-runtime pre/post exact SHA, clean/synced state, tag identities and installed Runtime identity are unchanged; no repository/live/host/release effects are caused by T6."

  - id: AC-7
    requirement: "Accepted T1-T5 Foundation implementation remains fully qualified."
    evidence_required: "Fresh Foundation artifact/product-state/focused/full/external/bootstrap/documents/standards/static/protected checks all PASS on unchanged governing source."

  - id: AC-8
    requirement: "T6 truthfully hands final closure judgment to independent Architect review."
    evidence_required: "All ACs PASS -> report result NEEDS_REVIEW as sole report-only child of unchanged execution base; any failed material predicate -> BLOCKED. Executor never self-accepts program closure."

