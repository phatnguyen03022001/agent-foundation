      required: true
    - id: CHECK-5
      command_or_check: "python3 -B skills/scripts/validate_skill_library.py and python3 -B skills/scripts/test_validate_skill_library.py"
      required: true
    - id: CHECK-6
      command_or_check: "Run the new research-fanout contract/renderer tests including exact three-packet independence, no peer-result leakage, authority NONE, malformed input failures, and deterministic output."
      required: true
    - id: CHECK-7
      command_or_check: "Run the new continuity-finding tests including owner-key isolation, deterministic deduplication, path containment, bounded metadata, no automatic task/owner-repository mutation, and fresh-revalidation gating."
      required: true
    - id: CHECK-8
      command_or_check: "Prove exactly two organizational roles remain; authority.lock and TASK-0007 external capability/adoption state remain unchanged; skill taxonomy remains exactly 15; agent-runtime is untouched."
      required: true
    - id: CHECK-9
      command_or_check: "python3 -m py_compile for new/modified Python files and git diff --check."
      required: true
    - id: CHECK-10
      command_or_check: "Fresh-resolve remote main immediately before non-force publication, then post-prove final main identity, ahead/behind, tracked worktree hygiene, and report publication."
      required: true
  authoritative_verification:
