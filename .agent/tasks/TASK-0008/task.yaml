structure_authority:
  status: RESOLVED
  source: "accepted TASK-0006 three-layer architecture and TASK-0007 L1 external capability implementation"
  rationale: "Research fan-out and finding continuity are L1 control-and-continuity concerns. They must remain non-authoritative coordination primitives under the existing Architect/Executor role model."

objective: "Operationalize L1 independent read-only research fan-out and cross-repository finding continuity with small repository-native contracts, templates, validation, and deterministic owner-keyed continuity storage, while preserving exactly two organizational roles, one-target authority, Architect final synthesis, and non-authoritative deferred findings."

scope:
  required_changes:
    - "Create one canonical machine-readable Research Request contract/template for advisory read-only Executor-specialized research. It must bind exact target repository, exact base revision, one bounded question, allowed evidence scope, minimal context references, no mutation authority, no final decision authority, and no peer-result visibility before return."
    - "Create one canonical machine-readable Research Result contract/template with compact FACTS, INFERENCES, OPTIONS, RECOMMENDATION, RISKS, UNKNOWN, and EVIDENCE sections. Material facts must carry source locators/identities; the result authority is NONE."
    - "Define a three-way fan-out rule that permits Architect to issue exactly three independent fresh-context research requests for materially uncertain direction-setting, while keeping normal single-research execution valid for narrower questions. The three researchers remain Executor specializations, do not see peer results before returning, and Architect synthesizes by evidence quality/applicability rather than majority vote or score."
    - "Provide one small deterministic repository-native renderer/validator that can validate Research Request/Result artifacts and, when given three valid request inputs, render three standalone prompt packets without embedding full conversation history or peer output."
    - "Create one canonical non-authoritative Continuity Finding schema/template for cross-repository FOLLOW_UP evidence. Each finding must bind source repository, source task/report/evidence locator when available, owner repository, bounded summary, observed fact versus inference, and status UNVALIDATED_FOR_OWNER."
    - "Create one Foundation-owned owner-keyed continuity store under profile/.agent/continuity/ where each owner repository resolves to one small deterministic JSON file containing only non-authoritative finding pointers/metadata, never copied full task/report bodies."
    - "Provide one deterministic repository-native continuity tool that can record/deduplicate a finding only under explicit current authority, writes only the owner-keyed continuity file, never mutates the owner repository, never creates a task, and never changes finding authority above NONE."
    - "Define binding-time consumption semantics: when Architect explicitly binds owner repository B, load only B's continuity file, fresh-resolve B canonical truth, revalidate each material finding, then discard, retain, or separately task it through normal Architect authority. Stale continuity data never authorizes action."
    - "Expose canonical repository-relative locators for the research contracts and continuity root through bootstrap/profile navigation at the active Foundation authority_set_identity revision, with fail-closed validation for malformed, missing, or escaping paths."
    - "Update Architect/Executor/Task Protocol wording only where necessary to route existing research/FOLLOW_UP semantics to these L1 primitives without duplicating generic methodology or changing L0 authority."
    - "Add repository-native tests proving independence boundaries, no peer-result leakage, authority NONE, owner-keyed isolation, deduplication, path containment, no automatic cross-repository mutation/task creation, and fresh-revalidation requirement."
    - "Publish TASK-0008 implementation and report by non-force fast-forward on main only."

  allowed_existing_files_or_components:
    - "profile/.agent/bootstrap/bootstrap.json"
    - "profile/.agent/bootstrap/validate.py"
    - "profile/.agent/bootstrap/test_bootstrap.py"
    - "profile/ARCHITECT_PROFILE.md only if a concise operator-owned writable continuity-store declaration is required"
    - "skills/contracts/FOUNDATION_ARCHITECTURE.md"
    - "skills/architect/SKILL.md"
    - "skills/executor/SKILL.md"
    - "skills/protocols/TASK_PROTOCOL.md"
    - "skills/README.md"
    - "skills/scripts/validate_skill_library.py"
    - "skills/scripts/test_validate_skill_library.py"
    - "README.md only if one concise navigation sentence is materially required"
    - ".agent/tasks/TASK-0008/**"

  expected_files_are_restrictive: false

invariants:
  - "Foundation remains MAIN_ONLY and all Foundation-internal canonical paths resolve from one exact authority_set_identity revision."
  - "There remain exactly two organizational roles: Architect and Executor."
  - "Researcher and Sync remain Executor specializations; specialization grants no additional authority."
  - "Research artifacts and continuity findings always have authority NONE and cannot create task, review, acceptance, mutation, rebinding, or release authority."
  - "Architect remains the sole owner of final research synthesis and canonical direction-setting judgment."
  - "Independent research means no peer-result visibility before individual return and no unnecessary full-conversation history in researcher input."
  - "Majority vote, model score, confidence averaging, or council consensus cannot substitute for evidence-based Architect synthesis."
  - "A continuity finding about repository B never mutates B and never authorizes action in B before explicit B binding and fresh revalidation."
  - "Continuity storage contains bounded pointers/metadata, not copied reports, transcripts, raw research logs, secrets, credentials, or large evidence bodies."
  - "Owner-keyed continuity lookup must not require scanning all repositories or all historical task reports."
  - "No daemon, queue, scheduler, database, telemetry service, message bus, issue tracker abstraction, or generic multi-agent orchestration framework is introduced."
  - "TASK-0007 external capability plane, authority.lock semantics, and 15-skill taxonomy remain unchanged."
  - "agent-runtime remains an orthogonal execution substrate and is not mutated by this task."

forbidden_changes:
  - "Create a third organizational role or make Researcher/Sync a governance peer of Architect/Executor."
  - "Create automatic researcher spawning infrastructure that depends on a provider-specific SDK or runtime framework."
  - "Give Researcher write authority to target repositories or final decision authority."
  - "Allow Researcher A/B/C to consume another researcher's result before its own result is finalized."
  - "Automatically create, prioritize, schedule, or execute tasks from continuity findings."
  - "Automatically mutate, open PRs/issues in, or otherwise write to an owner repository merely because a finding targets it."
  - "Store secrets, access tokens, raw full conversation history, full task/report copies, or broad repository dumps in continuity files."
  - "Modify external capability snapshots/catalog semantics from TASK-0007 except for navigation references strictly required by this task."
  - "Modify agent-runtime repository, Runtime installation/configuration/state, TCC, Keychain, System Settings, or host-global configuration."
  - "Create branches, PRs, tags, releases, or staging topology."

