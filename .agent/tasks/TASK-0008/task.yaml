  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: revised_contract_required
  dependency_change: revised_contract_required
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "Canonical Research Request and Research Result contracts exist, are machine-validated, have authority NONE, and bind exact target/base/question with compact evidence-oriented output."
    evidence_required: "Exact committed schemas/templates plus positive/negative validator tests for required fields, immutable base identity, read-only authority, evidence locators, and malformed artifacts."
  - id: AC-2
    requirement: "The three-way research fan-out mechanism renders exactly three standalone fresh-context prompt packets from three valid requests without peer-result content or full conversation history and preserves Architect-only final synthesis."
    evidence_required: "Deterministic renderer output/tests proving three independent packets, no cross-packet result leakage, bounded context references, and no voting/acceptance authority."
  - id: AC-3
    requirement: "Researcher remains an Executor specialization and no new organizational role, provider SDK dependency, or multi-agent orchestration framework is introduced."
    evidence_required: "Role-contract diff, dependency/diff proof, and tests/static assertions preserving exactly two organizational roles."
  - id: AC-4
    requirement: "Canonical Continuity Finding contract and owner-keyed store exist with authority NONE, status UNVALIDATED_FOR_OWNER, bounded source/evidence locators, and deterministic deduplication."
    evidence_required: "Exact schema/template/store paths plus tests for owner-key generation, deduplication, bounded fields, authority/status invariants, and deterministic serialization."
  - id: AC-5
    requirement: "Recording a continuity finding cannot mutate the owner repository, create a task, rebind target authority, or write outside the Foundation continuity root."
    evidence_required: "Write-boundary tests, path traversal rejection, negative tests for task/owner-repository mutation surfaces, and exact changed-path proof."
  - id: AC-6
    requirement: "Binding-time consumption loads only the explicitly bound owner's continuity file and requires fresh owner-repository truth/revalidation before any finding consequence."
    evidence_required: "Deterministic lookup/revalidation contract plus tests showing unrelated owner files are not loaded and stale/unvalidated findings cannot become authorized actions."
  - id: AC-7
    requirement: "Bootstrap/profile navigation exposes canonical Foundation-relative locators for research contracts and continuity root at the active authority_set_identity revision and fails closed for malformed/missing/escaping locators."
    evidence_required: "Bootstrap local/remote validation and focused fail-closed tests."
  - id: AC-8
    requirement: "Existing Architect/Executor/FOLLOW_UP semantics route to the new L1 primitives without weakening L0 task/report/review ownership, one-target binding, repository isolation, or acceptance authority."
    evidence_required: "Semantic diff mapping retained L0 guarantees and new L1 owners, plus existing protocol/skill regression PASS."
  - id: AC-9
    requirement: "TASK-0007 external capability plane, authority.lock identity, external adoption state, and exact 15-skill taxonomy remain unchanged."
    evidence_required: "Exact blob/diff proof for authority.lock and external capability artifacts unless navigation-only change is explicitly required, plus skill-library validation."
  - id: AC-10
    requirement: "All existing Foundation bootstrap, protocol, skill-library, and regression validation remains green."
    evidence_required: "All required repository-native verification commands PASS on the final candidate."

