  - "profile/.agent/program.generated.json has authority NONE and Foundation-native support authority locations."
  - "Each legacy repository is PUBLIC, not archived, default main, open PR count zero, and branch/ref identities match the exact expected state."
  - "Imported source-tip commits remain reachable from agent-foundation/main."
  - "If any gate fails, perform no retirement mutation and return ARCHITECT_JUDGMENT_REQUIRED."

partial_failure:
