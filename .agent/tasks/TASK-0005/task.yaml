  - "Historical references and negative fixtures mentioning legacy repositories remain untouched."
  - "agent-foundation and agent-runtime remain active and are not archived."
  - "agent-runtime remains a separate execution repository."
  - "Semantic owners remain profile, skills, documents, and standards."

pre_retirement_gates:
