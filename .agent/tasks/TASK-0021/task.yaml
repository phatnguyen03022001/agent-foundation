    - "Correct _first_unmet_agent_foundation_system_leaf or equivalent pure blocker-selection logic so PASS and N/A are skipped, and the first canonical-order status among FAIL, UNKNOWN, or PENDING is returned."
    - "Preserve canonical leaf order as the tie-break among actual blocking statuses."
    - "Apply the same N/A-exclusion semantics consistently to foundation, integration, verification, hardening, and production-acceptance leaf resolution."
    - "Keep production operational_readiness ordering unchanged: required-feature blockers first, then production acceptance blockers, then operational_readiness."
    - "Do not change aggregate precedence. N/A remains excluded from aggregation, all-N/A remains invalid, FAIL > UNKNOWN > PENDING > PASS remains unchanged."
    - "Do not change project-phase derivation, required-feature normalization, registry ordering, feature lifecycle semantics, release truth, or current derived phase/blocker."
    - "Add focused adversarial regressions proving N/A-before-UNKNOWN, N/A-before-PENDING, and N/A-before-FAIL each skip N/A and return the actual blocking leaf in canonical order."
    - "Add or retain a proof that an N/A production-acceptance leaf does not become the blocker when a later production-acceptance leaf is UNKNOWN/PENDING/FAIL."
    - "Retain all revision-1 T4 regressions for P0-P7 phases, aggregate precedence, all-N/A rejection, N/A justification, foreign-ID fail-closed behavior, registry-order feature tie-breaks, production acceptance/readiness separation, stored-phase mismatch, and current P0/release.status."
    - "Preserve product-state.json and AGENT_FOUNDATION_PRODUCT_STATE.md byte-for-byte unless the narrow blocker correction independently proves canonical truth must change. No current canonical state change is expected."
    - "Keep T1-T3 truth, seven-skill taxonomy, rationalization/external metadata, documents/, standards/, authority.lock.json, TASK-0014..0020, agent-runtime, Runtime/host state, credentials, branches, tags, and releases unchanged."
    - "On successful qualification create .agent/tasks/TASK-0021/report-r2.yaml with result NEEDS_REVIEW, commit it as the sole report-only child of the revision-2 implementation candidate, and publish by ordinary non-force fast-forward."

