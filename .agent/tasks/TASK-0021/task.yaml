invariants:
  - "product-state.json remains the sole machine-readable product-state SSOT."
  - "System-gate aggregate statuses and project phase are derived projections validated from leaf facts and release/feature state, never independently authored authority."
  - "Current release truth remains OPEN/null/UNKNOWN and therefore current phase is P0_SCOPE."
  - "Current F001 VERIFIED, F002 INTEGRATED, F003 VERIFIED, F004 INTEGRATED state remains unchanged unless fresh evidence independently proves a pre-existing defect."
  - "UNKNOWN never becomes PASS. N/A is justified exclusion, not PASS."
  - "Task/report/review status, Runtime state, and chat/UI state never manufacture global gate or project phase truth."
  - "Earliest blocker is deterministic and mirrors phase precedence; it does not become Architect behavior until T5."
  - "No global progression scheduler, daemon, queue, workflow engine, central multi-repository database, or background reconciler is introduced."
  - "No release identity or required feature set is invented merely to advance phase."

forbidden_changes:
  - "Create another product/project/system-gate state file."
  - "Freeze release scope, invent a release ID, or invent required_feature_ids."
  - "Promote feature state from TASK-0021 execution/report/review."
  - "Treat N/A as PASS without explicit exclusion semantics or allow an all-N/A aggregate to PASS."
  - "Use percentages or subjective interpretation to choose phase."
  - "Let later gate evidence override an earlier phase blocker."
  - "Select F002/F004 feature verification as current earliest blocker while release remains OPEN."
  - "Modify Architect skill progression behavior, task-generation behavior, execution/UI recovery, or adoption closure."
  - "Create T5/T6 task artifacts."
  - "Modify T1 architecture, T2 release semantics, T3 lifecycle semantics, protected domains, ECC/external pins, documents/, standards/, authority.lock.json, agent-runtime, Runtime/host state, credentials, branches, tags, releases, or repository metadata."

