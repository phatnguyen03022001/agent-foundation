structure_authority:
  status: RESOLVED
  source: "AGENT_FOUNDATION_PLAN.md sections 19-25, 42-48, constrained by accepted T1-T3 target state ownership"
  rationale: "T4 adds global system gates and deterministic project-phase/progression derivation to the existing product-state SSOT. It formalizes global-gate aggregation and earliest-blocker tie-breaks but does not yet modify Architect skill consumption behavior; that remains T5."

objective: "Establish agent-foundation's canonical global system gates, deterministic aggregate-gate semantics, deterministic project phase, and deterministic earliest-blocker resolver. Evolve product-state.json from schema version 2 to schema version 3 in place, preserving accepted T1-T3 product truth. Current release remains OPEN with unresolved required feature set, so the current derived project phase must be P0_SCOPE regardless of later feature/system-gate evidence. Formalize progression ordering without integrating it into Architect behavior yet."

scope:
  required_changes:
    - "Evolve product-state.json schema_version from 2 to 3 in place; do not create project-state.json, system-gates.json, progression.json, or another product-state authority."
    - "Preserve target identity, product_scope revision 1/FROZEN, exact F001-F004 identities and lifecycle states/evidence, and release OPEN/null/UNKNOWN truth unless fresh evidence independently proves a pre-existing canonical state defect."
    - "Extend product-state.json with exactly one target-owned system_gates object and one derived_project object."
    - "Use the canonical global gate groups foundation, integration, verification, hardening, production. Preserve the canonical plan leaf names unless a leaf is demonstrably inapplicable to agent-foundation; inapplicability is represented by N/A with explicit reason, not by deleting the canonical leaf."
    - "Foundation leaves: architecture, dependency_rules, test_infrastructure, telemetry, security, ci."
    - "Integration leaves: cross_feature_flows, contracts, data_consistency, authorization, external_dependencies."
    - "Verification leaves: unit, integration, contract, e2e, security, failure_paths."
    - "Hardening leaves: performance, capacity, security, privacy, observability, slo, alerts, rollback, backup_restore, disaster_recovery, cost."
    - "Production leaves: deployment, smoke_test, critical_journeys, telemetry, operational_readiness."
    - "Each system-gate leaf records status from PASS | FAIL | PENDING | N/A | UNKNOWN, bounded inspectable evidence_refs, and reason using the same fail-closed evidence principles as T3. PASS requires attributable persisted evidence; N/A requires explicit target-specific justification; UNKNOWN is never PASS."
    - "Each non-production group stores a derived aggregate status. Production stores derived acceptance_status over deployment, smoke_test, critical_journeys, telemetry; operational_readiness remains a separately evaluated leaf because the canonical phase algorithm checks it independently."
    - "Define deterministic aggregate precedence: any FAIL -> FAIL; otherwise any UNKNOWN -> UNKNOWN; otherwise any PENDING -> PENDING; otherwise all remaining leaves must be PASS or justified N/A and the aggregate is PASS. N/A is exclusion from applicability, never itself PASS. Reject malformed groups and aggregate disagreement."
    - "Require at least one applicable non-N/A leaf for any group/production acceptance aggregate to be PASS; an all-N/A group cannot manufacture PASS."
    - "Freshly audit current agent-foundation evidence for every global leaf. Use PASS only where target-owned persisted evidence supports the exact current fact. Use N/A only for genuinely inapplicable concerns with explicit justification. Use UNKNOWN where evidence is absent, stale, contradictory, or not attributable. Do not force generic fullstack/runtime concerns to PASS."
    - "Do not reinterpret fresh TASK-0021 terminal output as hidden global-gate PASS unless the result is persisted in canonical evidence that the candidate may validly reference without self-attestation. Current task/report/review state does not manufacture product state."
    - "Extend AGENT_FOUNDATION_PRODUCT_STATE.md in place as the single human-readable T2+T3+T4 contract. Document global gate semantics, aggregate precedence, derived project phase, and deterministic blocker ordering."
    - "Add derived_project containing exactly phase. Store the phase projection, but require validator recomputation and reject authored disagreement."
    - "Implement the canonical phase algorithm exactly: release not FROZEN or required release feature set unresolved -> P0_SCOPE; foundation aggregate not PASS -> P1_FOUNDATION; any required feature below INTEGRATED -> P2_FEATURE_BUILD; integration aggregate not PASS -> P3_INTEGRATION; any required feature below VERIFIED or verification aggregate not PASS -> P4_VERIFICATION; any required feature below RELEASE_READY or hardening aggregate not PASS -> P5_HARDENING; any required feature not LIVE or production acceptance not PASS or production operational_readiness not PASS -> P6_RELEASE_READY; otherwise P7_LIVE."
    - "Because current release.status is OPEN and required_feature_ids is unresolved, current derived_project.phase must be P0_SCOPE. Do not invent or freeze a release to exercise later phases."
    - "Implement a deterministic pure earliest-blocker resolver from canonical state without changing Architect skill behavior. It must mirror phase-algorithm precedence and use explicit tie-break ordering."
    - "Blocker ordering: P0 first release.status, then required_feature_ids_resolution; P1 foundation leaf order; P2 required features in canonical product-registry order, then earliest unmet feature lifecycle gate order; P3 integration leaf order; P4 required features below VERIFIED in registry order before verification-group leaves; P5 required features below RELEASE_READY in registry order before hardening leaves; P6 required features not LIVE in registry order before production acceptance leaves, then operational_readiness."
    - "When release required_feature_ids is resolved in test fixtures, normalize required-feature evaluation through canonical product-registry order rather than arbitrary input/list/set iteration. Unknown or foreign feature IDs fail closed."
    - "Current earliest blocker must resolve deterministically to release.status because current release scope is OPEN. Do not select F002/F004 verification while P0 blocks progression."
    - "Add focused regressions covering every P0-P7 phase branch, aggregate precedence, all-N/A rejection, N/A justification, UNKNOWN-not-PASS, production acceptance versus operational_readiness separation, registry-order feature tie-break, leaf-order tie-break, foreign required-feature rejection, derived-phase mismatch rejection, and current P0/release.status blocker."
    - "Keep T1 architecture, T2 scope/release truth, T3 feature lifecycle semantics/evidence, seven-skill taxonomy, rationalization/external metadata, documents/, standards/, authority.lock.json, TASK-0014..0020 historical artifacts, agent-runtime, Runtime/host state, credentials, branches, tags, and releases unchanged."
    - "Publish implementation/report on main only by ordinary non-force fast-forward."

