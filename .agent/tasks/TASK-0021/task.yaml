acceptance_criteria:
  - id: AC-1
    requirement: "Schema-3 product state contains one canonical global-system-gate model and one derived project-phase projection without duplicating product-state authority."
    evidence_required: "Exact object/schema proof shows system_gates + derived_project in product-state.json, no parallel state file, preserved T1-T3 state, and validator recomputation of derived fields."

  - id: AC-2
    requirement: "Global gate aggregation is deterministic and fail-closed."
    evidence_required: "Focused tests prove FAIL > UNKNOWN > PENDING > PASS precedence, justified N/A exclusion, all-N/A cannot PASS, missing/invalid evidence cannot manufacture PASS, and production acceptance excludes operational_readiness from its own aggregate while phase checks operational_readiness separately."

  - id: AC-3
    requirement: "Current global gate leaf truth is evidence-backed and target-specific."
    evidence_required: "Every PASS cites attributable persisted target evidence; every N/A has explicit applicability reason; missing/stale/contradictory evidence remains UNKNOWN. Independent review can reconstruct each group aggregate."

  - id: AC-4
    requirement: "Project phase derivation exactly follows canonical P0-P7 precedence."
    evidence_required: "Validator/tests cover each phase branch, recompute stored phase, reject mismatch, reject foreign/unresolved required-feature sets, and prove current canonical state derives P0_SCOPE because release is OPEN/unresolved."

  - id: AC-5
    requirement: "Earliest-blocker selection is deterministic without yet changing Architect behavior."
    evidence_required: "Pure resolver tests prove phase-order, registry-order and leaf-order tie-breaks, feature-before-system ordering where specified, production acceptance/readiness ordering, and current blocker release.status."

  - id: AC-6
    requirement: "T4 remains bounded and T1-T3/protected owners remain intact."
    evidence_required: "Base-to-candidate diff is limited to product-state, existing product-state contract, validator/tests; no T5/T6, Architect progression integration, execution recovery, or new orchestration infrastructure; protected objects unchanged."

  - id: AC-7
    requirement: "All affected qualification is green on one coherent final candidate."
    evidence_required: "Task validation, focused T4 tests plus existing T2/T3 regressions, full skills/protocol validator/regressions, external sync/regressions, profile bootstrap local/remote/regressions, documents tests, standards verifier with existing qualified interpreter, JSON parse, Python compile, protected/history checks, exact scope proof, internal links if affected, and git diff --check PASS."

