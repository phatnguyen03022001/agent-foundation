structure_authority:
  status: RESOLVED
  source: "operator-approved Foundation/ECC separation: Foundation governance, ECC engineering harness, target repository product truth"
  rationale: "The change establishes sourcing and routing semantics only. It reuses the existing external capability plane and exact ECC pin, introduces no new service or organizational layer, and intentionally defers internal-skill retirement to a later independently reviewable task."

objective: "Make exact-pinned ECC the default reusable generic engineering harness for Foundation-governed repository work while preserving Foundation as the authority/governance kernel and each target repository as product truth. Upgrade ECC from a skill-only external source concept to a deterministic harness source that can expose its relevant skills, commands, agents, and install/catalog metadata without activating upstream governance, hooks, installers, global configuration, or target mutation authority. Keep the current internal skill taxonomy intact in this task; only establish the seam and routing contract required for later safe rationalization."

scope:
  required_changes:
    - "Revise the Foundation architecture so L0 remains authority/governance, L1 remains deterministic capability control/continuity, and L2 no longer implies that Foundation should maintain a broad generic engineering methodology corpus. Generic engineering HOW should default to exact-pinned ECC when semantically applicable; Foundation-owned L2 content should survive only when it is Foundation-specific, an explicit compatibility/authority/evidence delta, or a capability not supplied by the admitted default harness."
    - "Define the reusable HOW selection order for normal repository work: exact target-repository truth and repo-native conventions first; then exact-pinned ECC as the default generic engineering harness; then another independently admitted exact external capability only when ECC is insufficient or materially inapplicable; then a Foundation-internal generic implementation only when a real Foundation-specific or uncovered capability remains. Availability, installation, loading, or provider identity never grants authority."
    - "Upgrade the ECC entry in skills/.agent/external-capabilities/sources.json from a skill-only capability-source description to an explicit deterministic harness-source description while preserving the exact revision bf70150eb2df8070024e5bdf08e4aa08959e2735 and MIT provenance."
    - "Represent only the ECC surfaces required for reusable engineering routing and reproducibility. At minimum, the source model must distinguish skills, commands, agents, and the deterministic manifest/catalog/install metadata required to resolve those surfaces. Do not treat upstream hooks, CLAUDE.md/AGENTS.md, role systems, session bootstrap, memory policy, task governance, installers, or host configuration as Foundation authority."
    - "Extend the existing external-capability synchronization/indexing machinery only as much as needed to model and deterministically validate the ECC harness surfaces. Reuse the current source registry, snapshots/catalog, and scripts; do not create a second registry, plugin manager, package manager, database, daemon, or service."
    - "Keep external snapshots/catalog inert metadata. Indexing or exposing an ECC command/agent/skill does not adopt it automatically, load it automatically, or authorize execution. Existing INDEXED/PINNED/SYNCED/ADOPTED/LOADED/AUTHORIZED distinctions remain binding."
    - "Update Architect procedure so generic engineering methodology is selected after exact target binding and material authority are known, with ECC as the default generic harness source. Architect still owns WHAT/BOUNDARY/PROOF and final review judgment; ECC may inform HOW but cannot create task/review/acceptance/rebinding/promotion/release authority."
    - "Update Executor capability acquisition so repository-native behavior and exact task authority remain primary, while generic implementation methodology defaults to the relevant exact-pinned ECC capability instead of automatically loading Foundation-maintained generic HOW. Executor must load only the minimum relevant ECC content and must not activate unrelated ECC commands, agents, hooks, installers, or settings."
    - "Provide a fail-closed fallback for environments where the ECC CLI is unavailable: exact source identity plus deterministic Foundation catalog/source metadata may resolve the required admitted capability without mutating host-global state. Do not require installing, updating, repairing, or configuring ECC as a precondition for ordinary Foundation governance."
    - "Preserve Matt skills, Superpowers, and Awesome as existing external sources. ECC becoming the default harness changes routing preference, not source authority or the ability to use a better exact admitted capability when ECC is materially insufficient."
    - "Do not remove, rename, or semantically rewrite the current internal skill directories in TASK-0014. Existing rationalization dispositions remain historical/current compatibility truth until the follow-up taxonomy task explicitly revises them."
    - "Add deterministic tests proving the ECC harness-source schema/pin/surface inventory, routing preference, authority separation, fail-closed resolution, and rejection of mutable/unpinned or governance-activating interpretations."
    - "Preserve Foundation MAIN_ONLY topology and publish implementation/report by non-force fast-forward on main only."

  allowed_existing_files_or_components:
