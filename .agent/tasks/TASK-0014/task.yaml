invariants:
  - "Foundation remains MAIN_ONLY and all Foundation-internal canonical paths resolve from one exact authority_set_identity revision."
  - "There remain exactly two organizational roles: Architect and Executor."
  - "Foundation L0 owns authority and lifecycle governance; ECC never becomes an authority source."
  - "Target repositories remain the canonical owners of product truth, architecture, code, tests, task-specific constraints, and repo-native build/test/lint behavior."
  - "Agent Runtime remains an orthogonal execution transport and receives no methodology or governance ownership."
  - "ECC is pinned exactly to bf70150eb2df8070024e5bdf08e4aa08959e2735 for this task; mutable main/latest identity is never sufficient."
  - "INDEXED != LOADED, PINNED != TRUSTED, SYNCED != ADOPTED, ADOPTED != AUTHORIZED, LOADED != AUTHORIZED, and SNAPSHOT != AUTHORITY remain true."
  - "ECC skills, commands, agents, manifests, and catalog/install metadata are reusable capability inputs only. ECC hooks, global/project installation side effects, role systems, memory/session governance, and repository governance are not activated by indexing."
  - "The current internal skill filesystem taxonomy and TASK-0010 rationalization dispositions remain unchanged in TASK-0014."
  - "Matt skills, Superpowers, and Awesome remain registered with their current exact source semantics."
  - "No package manager, plugin manager, registry service, daemon, scheduler, queue, database, provider pool, workflow engine, or fourth Foundation layer is introduced."
  - "documents/, standards/, profile operator preferences, authority.lock.json, agent-runtime, Runtime state, host security state, and credentials remain unchanged."

forbidden_changes:
  - "Delete, rename, or broadly rewrite internal Foundation skill implementations as part of this task."
  - "Make ECC task governance, roles, hooks, memory/session policy, installer behavior, or host configuration canonical Foundation authority."
  - "Install, update, repair, uninstall, or globally configure ECC, Claude, Codex, or another harness."
  - "Write .claude/, .codex/, .agents/, .cursor/, or equivalent project harness configuration into agent-foundation solely to satisfy ECC consumer audit shape."
  - "Use ECC harness-audit score as an acceptance score for Foundation architecture."
  - "Vendor ECC source bodies into Foundation or duplicate its generic methodology in new Foundation files."
  - "Replace exact immutable ECC identity with mutable main/latest/version-only routing."
  - "Remove or weaken task/report/review authority, exact-base binding, evidence validity, continuation, publication, promotion, release, or safety semantics."
  - "Modify documents/, standards/, authority.lock.json, agent-runtime, Runtime/tunnel state, Keychain, TCC, System Settings, credentials, branches, tags, releases, or repository metadata."

