acceptance_criteria:
  - id: AC-1
    requirement: "Foundation architecture explicitly establishes ECC as the default generic engineering harness without transferring L0 authority or target product ownership."
    evidence_required: "Exact contract diff defines the Foundation/ECC/target/Runtime ownership seam and the deterministic HOW sourcing order, with no new organizational role or fourth layer."

  - id: AC-2
    requirement: "ECC is modeled as one exact immutable harness source rather than only a SKILL.md index."
    evidence_required: "Committed source registry and deterministic generated/index evidence identify bf70150eb2df8070024e5bdf08e4aa08959e2735 and distinguish at least skills, commands, agents, and required deterministic manifest/catalog/install metadata; mutable or incomplete source identities are rejected."

  - id: AC-3
    requirement: "Architect and Executor route generic engineering HOW to the minimum relevant ECC capability while preserving exact task authority and repo-native truth."
    evidence_required: "Role-procedure diffs plus focused tests/fixtures show target bind -> authority -> repo-native context -> ECC capability selection, and prove ECC loading/availability never creates mutation or lifecycle authority."

  - id: AC-4
    requirement: "ECC CLI availability is an optimization, not a governance dependency."
    evidence_required: "Deterministic tests prove equivalent fail-closed capability resolution from exact pinned Foundation metadata when the CLI is unavailable, without global installation/configuration mutation."

  - id: AC-5
    requirement: "Existing external capability-state and provenance semantics remain intact."
    evidence_required: "Sync/index tests prove ECC harness surfaces remain inert metadata until separately selected/admitted/loaded, other external sources preserve their current identities, and upstream governance/hooks/install side effects are never activated by indexing."

  - id: AC-6
    requirement: "TASK-0014 creates the seam only and leaves taxonomy rationalization for a later task."
    evidence_required: "Exact diff proves current internal skill directories and skills/.agent/rationalization.json dispositions are unchanged, with no generic methodology copied into new Foundation-owned skill bodies."

  - id: AC-7
    requirement: "Unrelated Foundation and Runtime authority remains byte/identity stable."
    evidence_required: "Diff/object proof shows documents/, standards/, authority.lock.json, agent-runtime, operator routing, Runtime state/configuration, and repository topology are unchanged."

  - id: AC-8
    requirement: "All affected deterministic Foundation verification remains green."
    evidence_required: "Task artifact validation, external-capability sync/index tests, skill-library regressions affected by schema changes, bootstrap validation/tests, Python compilation for modified scripts, and git diff --check PASS on one coherent final candidate."

