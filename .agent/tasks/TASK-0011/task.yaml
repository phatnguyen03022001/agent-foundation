acceptance_criteria:
  - id: AC-1
    requirement: "Execution Bundle remains canonical while its optimization priority explicitly places survivability/recoverability ahead of round-trip minimization."
    evidence_required: "Exact Executor/Task Protocol contract diff and regression/static tests proving bounded bundling, permitted splits, and survival-aware carrier choice coexist."
  - id: AC-2
    requirement: "An active Execution Attempt can persist exactly one bounded unresolved Execution Slice with caller-known opaque identity and intent before consequence-bearing dispatch."
    evidence_required: "Exact contract/template/tool implementation plus deterministic tests for atomic pre-dispatch persistence, identity binding, one-unresolved-slice bound, and legacy attempt compatibility."
  - id: AC-3
    requirement: "Slice telemetry remains authority NONE, local Git-metadata-only, bounded, non-secret, and does not become an execution transcript or second authority store."
    evidence_required: "Schema/validator tests rejecting forbidden payload classes and proving no tracked/untracked worktree pollution."
  - id: AC-4
    requirement: "Generic OUTCOME_UNKNOWN semantics and no-blind-retry behavior are defined for mutating requests whose response does not establish outcome."
    evidence_required: "Contract + focused state-machine tests covering intent-only crash, ambiguous response, safe reconciliation, and rejection of blind repeated mutation."
  - id: AC-5
    requirement: "Consequence-specific reconciliation is defined for long Runtime start, expected-state file mutation, Git commit/update, Git publication, and report publication without introducing a transaction framework."
    evidence_required: "Machine-checkable reconciliation classification fixtures/tests and exact links to existing expected-state/remote-observation semantics where applicable."
  - id: AC-6
    requirement: "Carrier selection is deterministic enough to protect survival while remaining capability-gated: terminal_exec is limited to bounded synchronous-safe work; long/uncertain/interactive/survival-sensitive work requires a recoverable async carrier when available."
    evidence_required: "Positive/negative carrier-selection tests including current keyed-capability-unavailable cases."
  - id: AC-7
    requirement: "Before Runtime Task B/C activation, Foundation remains internally coherent: authority.lock is unchanged and unsafe survival-sensitive async mutation fails closed or uses an independently reconcilable already-authorized alternative."
    evidence_required: "Exact authority.lock blob proof, capability-gating tests, and no claim of keyed Runtime availability."
  - id: AC-8
    requirement: "Evidence-compaction semantics preserve truthful proof: large/raw output stays external/addressable where available; truncation or missing evidence remains unresolved and never becomes PASS."
    evidence_required: "Contract/tests covering bounded model-visible evidence, truncated/missing evidence, and safe verification rerun versus forbidden mutation replay."
  - id: AC-9
    requirement: "TASK-0007/0008/0009/0010 semantics remain intact; documents/, standards/, authority.lock.json, and agent-runtime remain unchanged."
    evidence_required: "Exact blob/tree/diff proof plus focused regressions for external capabilities, research fan-out, continuity findings, execution attempts, and rationalized skill library."
  - id: AC-10
    requirement: "All existing Foundation bootstrap, skill-library, protocol, continuity, and regression verification remains green on the final candidate."
    evidence_required: "All required repository-native verification commands PASS."

