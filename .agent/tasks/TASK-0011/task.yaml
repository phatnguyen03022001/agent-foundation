structure_authority:
  status: RESOLVED
  source: "accepted three-layer Foundation architecture plus TASK-0009 execution-attempt continuity"
  rationale: "Execution survival extends existing L1 continuity and Executor procedure. It does not add a new organizational role, fourth layer, workflow engine, Runtime implementation, or product-document authority."

objective: "Extend Foundation execution semantics so conversation/tool transport interruption cannot authorize blind mutation retry: preserve the existing bounded Execution Bundle model, prioritize survivability/recoverability over round-trip minimization, add one minimal unresolved Execution Slice under each active Execution Attempt, persist caller-known pre-dispatch intent before consequence-bearing dispatch, classify ambiguous mutating outcomes as OUTCOME_UNKNOWN, require consequence-specific reconciliation before retry, and fail closed when current selected Runtime lacks the later keyed recoverable-session capability."

scope:
  required_changes:
    - "Preserve Execution Bundle as the bounded deterministic synchronization-reduction abstraction. Do not replace it with per-tool orchestration."
    - "Define execution decision priority as correctness, then survivability/recoverability, then boundedness, then round-trip minimization. Round-trip reduction never overrides recoverability."
    - "Add one minimal Execution Slice concept under an active Execution Attempt. The attempt lifecycle remains RUNNING/TERMINAL and observer classifications ACTIVE_LEASE/INTERRUPTED_UNKNOWN/TERMINAL_CONFIRMED remain unchanged."
    - "Persist at most one unresolved/current consequence-bearing slice in existing repository-local Git metadata. Do not create an independent database, queue, registry service, or second continuity store."
    - "Generate an opaque caller-known execution_slice_id before any consequence-bearing dispatch and atomically persist slice intent before the first side-effecting request may leave the caller."
    - "Persist only bounded non-secret slice data sufficient for recovery: slice identity/ordinal, operation class, selected carrier, bounded intent, reconciliation kind/postcondition kind, lifecycle observation, optional known runtime session observation, and result classification. Do not persist raw argv, environment, credentials, prompt/conversation bodies, raw tool output, full diffs, file bodies, or broad inventories."
    - "Define generic OUTCOME_UNKNOWN semantics: if a mutating request may have left the caller and the response does not establish whether the side effect occurred, the outcome is unknown. Lost response is neither failure nor evidence that no side effect happened."
    - "Define a generic no-blind-retry invariant: OUTCOME_UNKNOWN requires consequence-specific fresh reconciliation before any repeated mutation. Retry is permitted only when fresh attributable state establishes that the intended effect is absent and the original preconditions still hold, or when the selected tool's exact idempotent/expected-state contract proves replay-safe."
    - "Define consequence-specific reconciliation classes at minimum for long Runtime start, expected-state filesystem mutation, Git commit/update, canonical Git publication, and report publication. Reuse existing expected-state/remote-observation semantics rather than adding a transaction framework."
    - "Define minimal slice crash semantics: INTENT_RECORDED with no later trustworthy observation means MAY_HAVE_BEEN_DISPATCHED / OUTCOME_UNKNOWN, not NOT_DISPATCHED. Do not require a fictitious durable DISPATCHED transition around a network call."
    - "When a slice result and postcondition are established and a coherent recovery checkpoint exists, mark/clear the unresolved slice so Git/post-state becomes the durable consequence evidence. Do not retain unbounded slice history."
    - "Define carrier selection without inventing a platform timeout: confidently bounded, non-interactive, synchronously safe work may use terminal_exec; long, duration-uncertain, interactive, or survival-sensitive work requires a recoverable asynchronous carrier when such capability is currently authorized and available."
    - "A duration guideline around one minute may be expressed only as non-normative operational guidance/soft policy if useful. Do not encode 25/30-minute platform assumptions, 8-minute rules, or tool-boundary counts as correctness semantics."
    - "Define transitional capability gating: TASK-0011 does not activate a keyed Runtime capability and does not change authority.lock.json. Until a later accepted Runtime revision and Foundation cutover provide caller-keyed recoverable terminal sessions, survival-sensitive asynchronous mutation that cannot be independently reconciled must fail closed as CURRENT_PHASE_CAPABILITY_UNAVAILABLE or use an already-authorized expected-state/bounded alternative that preserves proof."
    - "Unkeyed terminal_start may remain usable only where the consequence is read-only, independently replay-safe, or otherwise fully reconcilable under current authority; it must not be described as lost-ACK recoverable."
    - "Define evidence-compaction semantics: model-visible output should be the minimum sufficient bounded evidence; large/raw logs remain external and addressable where available. Truncated/missing raw evidence never becomes PASS and may require safe re-verification."
    - "Extend execution_attempt.py/template/tests deterministically and compatibly. Existing TASK-0009 attempt records must either remain readable as legacy records with no active slice or be handled by an explicit fail-closed version rule; do not silently reinterpret old bytes."
    - "Update Architect/Executor/Task Protocol/Foundation Architecture only where needed to route survival, unknown-outcome, and successor-recovery semantics without duplicating standards or document-model ownership."
    - "Consult documents/ and standards/ as normative ownership/evidence constraints and keep those domains byte-unchanged. If implementation appears to require changing documents/ or standards/, stop for Architect revision."
    - "Preserve TASK-0007 external capability plane, TASK-0008 research/continuity semantics, TASK-0009 attempt lease semantics, TASK-0010 rationalization, authority.lock.json, and agent-runtime."
    - "Publish TASK-0011 implementation and report by non-force fast-forward on main only."

