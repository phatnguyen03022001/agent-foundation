      required: true
    - id: CHECK-3
      command_or_check: "Run deterministic failure-injection tests at minimum for crash after intent write/before dispatch, after possible dispatch/before ACK observation, after ACK observation/before checkpoint, and after result observation/before checkpoint; observer must not infer more than durable evidence proves."
      required: true
    - id: CHECK-4
      command_or_check: "Run carrier-selection/reconciliation tests for terminal_exec, current unkeyed terminal_start, expected-state filesystem mutation, Git commit/update, repo publication, and report publication."
      required: true
    - id: CHECK-5
