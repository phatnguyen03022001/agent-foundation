invariants:
  - "Foundation remains MAIN_ONLY with exactly two organizational roles: Architect and Executor."
  - "Execution Bundle remains a bounded deterministic execution abstraction; this task changes carrier-selection priority, not the existence of bundling."
  - "Execution Attempt producer states remain exactly RUNNING and TERMINAL; ACTIVE_LEASE remains lease freshness only; INTERRUPTED_UNKNOWN remains non-terminal uncertainty; TERMINAL_CONFIRMED still requires explicit terminalization."
  - "Execution Slice is local L1 continuity telemetry with authority NONE and never grants mutation, task, review, acceptance, rebinding, promotion, release, or publication authority."
  - "At most one unresolved consequence-bearing slice is required per active attempt; no unbounded execution transcript or slice event log is introduced."
  - "A consequence-bearing slice identity and intent exist durably before the side-effecting dispatch may occur."
  - "INTENT_RECORDED without trustworthy later evidence never proves dispatch did not happen."
  - "Lost or ambiguous response to a mutating operation produces OUTCOME_UNKNOWN unless a stronger tool contract or fresh postcondition observation establishes the effect."
  - "OUTCOME_UNKNOWN never authorizes blind retry."
  - "Fresh remote/local/task/postcondition evidence remains required before continuation, cleanup, replay, publication, or recovery consequence."
  - "No hard ChatGPT time limit, universal tool-call cap, or arbitrary model/tool-boundary count is encoded as a Foundation correctness fact."
  - "Current authority.lock.json remains unchanged and the current selected Runtime is not claimed to provide caller-keyed lost-ACK recovery."
  - "No new daemon, scheduler, queue, database, workflow engine, generic retry engine, process supervisor, service, provider-private API, organizational role, or fourth Foundation layer is introduced."
  - "documents/ and standards/ remain byte-unchanged."
  - "agent-runtime source, installation, service, runtime.env, host permissions, and deployment state remain untouched."

forbidden_changes:
  - "Remove or weaken existing TASK-0009 attempt continuity semantics."
  - "Replace Execution Bundle with a generic orchestrator or one-tool-at-a-time workflow."
  - "Treat lost response as failure, not-dispatched, safe retry, or automatic permission to repeat mutation."
  - "Persist raw argv, environment, credentials, secrets, prompts, transcripts, raw tool logs, full diffs, file bodies, or broad inventories in slice telemetry."
  - "Create unbounded slice history or a second persistent continuity database/store."
  - "Claim current unkeyed terminal_start is deterministically recoverable from a lost start acknowledgement."
  - "Change authority.lock.json or pin a new Runtime revision."
  - "Modify agent-runtime repository or Runtime lifecycle/configuration/state."
  - "Modify documents/ or standards/."
  - "Create branches, PRs, tags, releases, staging topology, daemons, queues, schedulers, or databases."

