structure_authority:
  status: RESOLVED
  source: "inspected existing one-paragraph Task Protocol readiness gate, duplicated Architect readiness paragraph, Documents V1 feature/unknown/build-buy/closure owners and exact ECC planning/research entries"
  rationale: "Existing owners already cover the component semantics. The missing small delta is an explicit consumption gate for material feature design/research evidence before code, including its limits. Extend that existing gate, replace the duplicated Architect paragraph with a shorter owner link/read trigger and add a concise README locator; no new document model, planner, registry, phase machine or feature template."
objective: "Make target-owned material feature design and applicable stack/third-party research precede consequential implementation, without confusing documentation closure with environment proof or increasing Architect context."
scope:
  required_changes:
    - "Fresh-resolve exact handoff, safely fast-forward the designated mirror and bind TASK-0030 ACCEPTED review. Permit precisely the pinned .DS_Store exception; unexpected edits/paths, divergence, conflicts or Git-operation state are BLOCKED."
    - "Extend only the existing Material-design-readiness gate section in Task Protocol. For consequential feature implementation, require applicable target-owned design evidence sufficient to determine the feature's observable scope/behavior/acceptance and material architecture/contracts/ownership constraints, including frontend/backend/data boundaries where relevant. Resolve concerns through existing target owners and cross-references, not a new Foundation checklist/taxonomy or a mandatory per-feature filename. Preserve the existing proportional exception for trivial, mechanical, reversible or well-specified work; require completeness for the current material feature/scope rather than exhaustive future-project documentation."
    - "Make material stack, build/buy and third-party decisions evidence-backed before code that relies on them. Reuse current target-native choices when adequate; research only missing material choices using ECC HOW and relevant primary/official technical evidence with resolvable source/version or observation identity where material. Record the chosen outcome, alternatives/rationale and material compatibility, dependency, cost, trust/permission or exit constraints in their existing target-owned design/decision owners as applicable. A vendor recommendation, loaded HOW or local dependency availability does not authorize purchase, account setup, installation, contract change or implementation. Missing evidence stays unknown and required material decisions return to Architect through the existing gate. This task specifies evidence boundaries only; it does not choose an actual product stack/vendor or duplicate research methodology."
    - "Separate documented design from implementation readiness: target documentation closure is scoped and target-defined. Documents V1 structural DOCS_READY, when adopted, establishes only its documented structural predicate; it cannot prove prose correctness, real-environment capability, task authority, feature/gate verification or absence of material boundary-changing implementation unknowns. Known material design decisions must be resolved before dependent implementation; still-open environment/boundary unknowns remain explicit and need bounded discovery/probe evidence or an already authorized bounded component/mutation scope before consequential dependent implementation. Do not force every non-material implementation detail or unrelated future feature to be resolved first, and do not freeze exact files/defects by guessing. Keep authority, capability and unknown execution effects distinct. Add no authority_mode/material_unknowns fields or adaptive lifecycle semantics."
    - "Use Documents V1 only as an applicable target-owned model: its feature behavior/acceptance, decisions, relations, unknowns and build/buy semantics remain at Documents' existing owners. Preserve the filename-neutral target authority seam and proportional rules. No universal eight-file requirement, DOCS_READY mandate for every project, phase matrix, release/readiness state, feature checklist, schema or new task field is introduced. Generic feature design, technology evaluation and engineering HOW stay in ECC."
    - "Replace only Architect's existing readiness-summary paragraph under Material-design-readiness and proportional execution with a concise exact link to Task Protocol's existing gate and a clear read trigger before authorizing consequential feature implementation. Preserve the surrounding lane/positive-authority text, all existing owner-map links/read triggers, all other role bytes and provider policy. Architect final size must be <=16717 bytes; Executor stays byte-identical at 17359. Add only a concise gate locator in skills README, without another normative copy."
    - "Persist three compact concrete synthetic walkthroughs in the report, with explicit given facts, evidence locators and conclusions: (1) a documented feature has resolved observable acceptance, applicable FE/BE/data contracts and existing scoped rules, so its material design predicate is satisfied for the declared scope without loading unrelated features; (2) an integration feature has not resolved a material third-party compatibility/permission or dependency choice, so dependent implementation is not authorized by documentation presence or an ECC recommendation, and the next bounded work is research/design; (3) structurally closed target docs coexist with an unprobed environment fact that could change the implementation boundary, so normal dependent implementation is not justified solely by DOCS_READY and the uncertainty must be probed or governed inside existing explicit bounded authority. Include a contrasting small mechanical well-specified change that does not acquire feature-design ceremony. These are synthetic inputs, not actual product decisions, another repository binding or live vendor/capability claims."
    - "Keep the three-file net UTF-8 addition <=4000 bytes relative to handoff base and Architect <=16717. No generic HOW bodies or document concern inventories are copied. Run native skills validator, full existing skills 240/240 and external 26/26 because the changed gate/role are existing consumer inputs; current task/report artifact validation; new owner-link/anchor resolution; exact kernel-edit boundary and protected/scope/inventory checks; git diff --check. No source-code/test mutation, live upstream metadata refresh, native Documents/Standards suite reruns or dependencies absent relevant input invalidation. Do not add tests that merely mirror new prose."
    - "Commit the qualified candidate as the direct child of exact handoff base, then its sole report-only child. Preserve protocol-v3 publication eligibility and truthful candidate-prepublication pushed state. After ordinary non-force MAIN_ONLY publication, fresh external closure has local main, origin/main and remote main equal the report commit, one worktree, tracked/index cleanliness and pinned .DS_Store. Finish NEEDS_REVIEW and stop before slice planning, continuation redesign, dogfood or successor execution."
