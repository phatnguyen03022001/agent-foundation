  scope_expansion: forbidden
  architecture_change: revised_contract_required
  spec_change: revised_contract_required
  dependency_change: forbidden
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "agent-foundation has one canonical target-owned T2 product-state contract and one machine-readable product-state artifact, both distinct from Foundation governance and PROGRAM planning data."
    evidence_required: "Contract/navigation and object identity prove skills/contracts/AGENT_FOUNDATION_PRODUCT_STATE.md plus product-state.json are the sole T2 owners; PROGRAM remains authority NONE and no duplicate product-state owner is introduced."

  - id: AC-2
    requirement: "Current product scope is frozen deterministically at the four accepted T1 semantic product capabilities."
    evidence_required: "Machine-readable registry and focused tests prove product_scope revision 1, scope_status FROZEN, features.total 4, exact unique F001-F004 semantic mapping/owner domains, and explicit future scope-revision requirement for inventory change."

  - id: AC-3
    requirement: "Current release-scope truth is explicit without guessing."
    evidence_required: "Repository evidence shows no unified release/tag authority; product-state records release scope OPEN, unresolved/null release identity and required feature set with explicit UNKNOWN semantics, and tests reject empty-set or invented-release reinterpretation."

  - id: AC-4
    requirement: "T2 does not create a second lifecycle-state SSOT before T3."
    evidence_required: "Schema/tests reject feature state, gates, project phase, global gates, completion/readiness fields and prove task/report/review or PROGRAM cannot manufacture product state."

  - id: AC-5
    requirement: "The registry remains product inventory rather than task/execution/chat storage."
    evidence_required: "Negative tests reject task refs, prompts, chat/model IDs, logs, process/execution IDs, raw tool output, arbitrary TODO/diary fields, duplicate IDs, count mismatch, unknown fields, and malformed unresolved release representation."

  - id: AC-6
    requirement: "T1 and accepted Foundation governance/external seams remain intact."
    evidence_required: "Exact protected-object/diff proof shows T1 substantive contract, seven-skill inventory, rationalization, external-capability tree, documents/, standards/, authority.lock.json, and historical TASK-0014..0018 artifacts unchanged except explicitly authorized concise navigation."

  - id: AC-7
    requirement: "T2 remains one bounded acceptance boundary and does not implement T3-T6."
    evidence_required: "Base-to-candidate diff contains only T2 state contract/data/navigation/tests; no lifecycle state engine, gate evaluator, phase/progression logic, execution recovery redesign, closure work, or future task artifacts."

  - id: AC-8
    requirement: "All affected deterministic verification is green on one coherent final candidate."
    evidence_required: "Task validation, focused T2 registry tests, full skill/protocol validator/regressions, external sync/regressions, bootstrap local/remote validation/regressions, modified Python compilation, JSON parse/schema checks, internal links when affected, and git diff --check PASS."

