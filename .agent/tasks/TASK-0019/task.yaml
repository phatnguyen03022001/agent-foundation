structure_authority:
  status: RESOLVED
  source: "AGENT_FOUNDATION_PLAN.md sections 13-14 and 33-35, constrained by accepted TASK-0018 T1 ownership"
  rationale: "T2 establishes one target-owned product-state contract plus one machine-readable current scope/registry artifact. It does not derive feature lifecycle state, gates, project phase, Architect progression, execution recovery, or closure. Existing PROGRAM remains derived authority-NONE planning data and must not be reused as product-state SSOT."

objective: "Establish agent-foundation's canonical target-owned T2 product scope, release-scope truth, and feature registry without inventing a release identity or feature lifecycle state. Freeze the current product feature inventory at the four durable semantic product capabilities accepted by TASK-0018, assign stable feature identities, and record release-scope truth faithfully. Because current repository evidence contains no unified agent-foundation release/tag authority, represent the current release scope as OPEN with unresolved release identity and required release feature set rather than manufacturing an R1/version. Keep feature state absent from T2; T3 will separately define evidence/gate-derived lifecycle state."

scope:
  required_changes:
    - "Inspect current repository-wide release/version evidence before mutation and independently confirm that agent-foundation has no unified canonical release/tag identity that would justify a frozen current release scope. Domain-local documents/standards version statements do not automatically create a repository-wide release."
    - "Create one canonical target-owned product-state contract distinct from Foundation governance/control-plane contracts. It must define T2 ownership for current product scope, release-scope truth, feature identity/registry semantics, freeze/revision behavior, and T2/T3 separation."
    - "Create one machine-readable target-specific product-state artifact at repository root named product-state.json. The filename is canonical only because this target contract explicitly binds it; it is not a universal Foundation requirement for other repositories."
    - "Bind product-state.json to target phatnguyen03022001/agent-foundation with schema_version 1 and an explicit product_scope revision."
    - "Freeze current product scope revision 1 at exactly four features whose semantics come from accepted TASK-0018, not directory names: F001 operator-and-architect-configuration (profile/ owner), F002 governance-control-and-capability (skills/ owner), F003 documentation-model-and-closure (documents/ owner), and F004 engineering-assurance (standards/ owner)."
    - "Require features.total == 4 and exact one-to-one agreement between total, unique feature IDs, unique semantic names, and current registered features. Adding/removing/renaming a feature under a frozen product scope requires an explicit future scope revision."
    - "Record current release scope truth as OPEN. Because no unified release identity or required release feature set is currently established by target authority, release.id and release.required_feature_ids must remain unresolved/null with an explicit UNKNOWN/unresolved marker rather than an empty-set interpretation."
    - "Define product scope separately from release scope. Freezing the four-feature product inventory must not falsely imply that all four are required for a particular release."
    - "Do not add feature lifecycle state, feature gates, gate applicability, verification state, project phase, progress percentage, global system gates, earliest-blocker selection, task references, execution attempt data, prompts, chat/model IDs, process IDs, raw tool output, logs, arbitrary TODOs, or implementation diary fields to product-state.json."
    - "Explicitly reject using profile/.agent/program.generated.json, task/report/review artifacts, chat state, or Runtime state as the feature registry or release-scope owner. PROGRAM remains authority NONE and task lifecycle does not manufacture product state."
    - "Define UNKNOWN semantics for missing or unresolved release facts: unresolved release identity/required feature set is not equivalent to an empty release, FROZEN, PASS, DONE, or release readiness."
    - "Add deterministic regression coverage for exact four-feature inventory, stable IDs/owners, product-scope freeze/revision semantics, OPEN release with unresolved identity/required set, no feature state/gates, forbidden operational/task/chat fields, PROGRAM non-authority, and count/duplicate/drift failures."
    - "Keep the accepted T1 architecture contract semantically unchanged except for a concise navigation link to the new T2 product-state contract if necessary. Do not alter T1 ownership boundaries."
    - "Keep TASK-0014 through TASK-0018 historical task/report/review artifacts unchanged. Keep seven-skill taxonomy, rationalization, ECC/external-capability metadata, documents/, standards/, bootstrap authority lock, agent-runtime, Runtime/host state, credentials, branches, tags, and releases unchanged."
    - "Publish implementation/report on main only by ordinary non-force fast-forward."

  allowed_existing_files_or_components:
    - "product-state.json"
    - "skills/contracts/AGENT_FOUNDATION_PRODUCT_STATE.md"
    - "skills/contracts/AGENT_FOUNDATION_PRODUCT_ARCHITECTURE.md only for concise T2 navigation if needed"
    - "README.md only for concise product-state navigation"
    - "skills/README.md only for concise contract navigation"
    - "skills/scripts/validate_skill_library.py only if deterministic product-state validation is cleanly supportable without making generic Foundation doctrine own target state"
    - "skills/scripts/test_validate_skill_library.py"
    - ".agent/tasks/TASK-0019/**"

  expected_files_are_restrictive: false

invariants:
  - "agent-foundation remains the exact target repository and canonical owner of its product truth."
  - "T1 product architecture remains accepted and unchanged in substance."
  - "Current product scope revision 1 contains exactly four semantic product features/capabilities accepted by TASK-0018."
  - "Current repository-wide release scope remains OPEN unless exact target evidence proves a unified release identity and required feature set; TASK-0019 does not manufacture either."
  - "Product scope and release scope remain distinct."
  - "T2 does not persist or derive feature lifecycle state; no feature state field is canonicalized before T3."
  - "PROGRAM, task/governance state, execution state, and UI/conversation state remain non-owners of product scope and registry truth."
  - "No universal target manifest is introduced: product-state.json is target-specific to agent-foundation."
  - "No task tracker, execution log, process registry, workflow engine, central multi-repository state database, scheduler, daemon, queue, or background reconciler is introduced."
  - "Seven-skill taxonomy and exact-pinned external capability plane remain unchanged."
  - "documents/, standards/, profile/.agent/bootstrap/authority.lock.json, agent-runtime, Runtime/host state, credentials, branches, tags, and releases remain unchanged."
  - "One initiating chat/session is never required to reconstruct product scope or registry truth."

forbidden_changes:
  - "Create or pre-author T3-T6 task artifacts."
  - "Invent a repository-wide release ID such as R1, v1, current, latest, or a semantic version without exact target authority."
  - "Treat documents/ v1.0.0, standards/ v1.0.0, task protocol v3, Runtime version, or another domain-local version as the unified agent-foundation release identity."
  - "Persist a feature state field, gates, global gates, phase, progression selection, completion percentage, or release readiness in T2."
  - "Use an empty required_feature_ids array to mean unresolved release scope."
  - "Use program.generated.json or task/report/review lifecycle as product feature registry state."
  - "Store prompts, chat IDs, model IDs, raw tool output, terminal logs, process IDs, execution attempts, arbitrary TODO lists, or implementation diary in the registry."
  - "Modify T1 architecture semantics, Architect/Executor progression behavior, execution/UI recovery, ECC/external pins, rationalization, documents/, standards/, bootstrap authority lock, agent-runtime, Runtime/tunnel state, credentials, host security state, branches, tags, releases, or repository metadata."

