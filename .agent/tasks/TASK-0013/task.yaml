structure_authority:
  status: RESOLVED
  source: "existing protocol-v3 candidate/report lineage and repo_publish CAS semantics"
  rationale: "The optimization changes closure procedure only. It requires no new artifact type, lifecycle state, daemon, cache, registry, workflow engine, or Runtime capability."

objective: "Reduce happy-path Executor closure synchronization without weakening proof by making one-shot candidate-plus-report publication the preferred protocol-v3 path when all candidate acceptance evidence is already locally/resolvably complete and no external verifier or other authority requires the implementation candidate to be remotely visible before report authorship. Preserve the candidate as the report's exact sole parent, publish the report commit by one non-force CAS fast-forward from the unchanged remote base so both commits become remote atomically, and retain the existing two-publication path only when a real remote-candidate dependency requires it. Dogfood the optimized closure in TASK-0013 under the accepted TASK-0012 performance attribution."

scope:
  required_changes:
    - "Clarify that protocol-v3 does not inherently require the implementation candidate to be published before report authorship. The immutable local candidate may remain unpublished while the Executor authors/validates its report-only direct child."
    - "Define the preferred single-publication closure eligibility gate: exact remote ref still equals the authorized execution base; candidate is immutable and fully verified; all evidence required before report authorship is already available without remote candidate visibility; task grants both report commit and push authority; report can truthfully record candidate/pre-publication facts; and no CI, external verifier, cross-checkout consumer, promotion prerequisite, or other authority requires the candidate SHA to be remote before the report exists."
    - "On the eligible path, create the candidate commit locally, create/validate the report-only direct child locally, then perform exactly one ordinary non-force CAS publication from expected remote base to the report commit. This publication makes both the candidate and report reachable without a separate candidate push."
    - "After that one publication, perform the normal fresh remote consequence-boundary proof: remote main equals exact report commit, report has exact candidate sole parent, report diff is report-only, candidate remains the exact final_execution_head, and topology/invariants required by the task remain satisfied."
    - "The report must not self-claim its own publication. On the single-publication path, any field meaning 'implementation candidate was already pushed before report authorship' must remain false/omitted as allowed by the canonical schema. Remote reachability of candidate/report is proven after publication and again by Architect review."
    - "Preserve the existing two-publication path when remote candidate visibility is materially required before report authorship, including an external/CI verifier that consumes remote SHA, a separate checkout/session that must resolve candidate evidence before report construction, explicit task authority requiring candidate publication, or another concrete consequence boundary."
    - "Do not split publication merely for ceremony, confidence, or historical habit. Conversely, do not use one-shot publication to skip a required remote-candidate verifier or fresh consequence-boundary check."
    - "Preserve failure semantics. If the single CAS publication fails or is ambiguous, reconcile remote ref truth before retry; never create a second publication attempt from unknown effect. A local candidate/report pair remains immutable evidence but is not canonical remote evidence until publication is proven."
    - "Preserve candidate/report identity semantics: final_execution_head remains the implementation candidate; reviewed_report.commit remains the report commit; report remains a sole direct child and separate artifact."
    - "Preserve current sparse report/evidence-dedup semantics and current verification selection/dedup rules. This task must not weaken or remove any acceptance predicate."
    - "Use TASK-0012 schema-v3 performance attribution from the start of TASK-0013 preflight. Mark only semantic boundaries. Dogfood the optimized path and record publication invocation count plus the read-only performance summary as non-authoritative evidence."
    - "TASK-0013 itself is eligible for the single-publication closure only if all its required candidate verification is local/resolvable without remote candidate visibility. If execution discovers a real remote-candidate dependency, use the existing two-publication path and report the reason rather than weakening proof."
    - "Keep execution-attempt telemetry semantics, Runtime, documents/, standards/, bootstrap routing/authority lock, external capability identities, repository topology, and organizational roles unchanged."
    - "Publish implementation/report on main only by non-force fast-forward."

  allowed_existing_files_or_components:
    - "skills/contracts/IMPLEMENTATION_REPORT.md"
    - "skills/executor/SKILL.md"
    - "skills/protocols/TASK_PROTOCOL.md"
    - "skills/verification/SKILL.md only if needed to state the remote-verifier exception without duplicating existing verification semantics"
