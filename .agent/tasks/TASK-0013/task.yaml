    - ".agent/tasks/TASK-0013/**"

invariants:
  - "Foundation remains MAIN_ONLY with exactly Architect and Executor roles."
  - "No acceptance, verification, remote freshness, report identity, review independence, retry, or consequence-boundary predicate is removed."
  - "final_execution_head remains the exact implementation candidate and reviewed_report.commit remains the exact report commit."
  - "Report remains a sole direct child of the candidate and report content cannot self-attest its own publication."
  - "One-shot publication is permitted only when the remote ref still equals the authorized base and no required evidence depends on candidate remote visibility before report authorship."
  - "Two-publication closure remains available and required whenever a real remote-candidate dependency exists."
  - "Publication ambiguity never authorizes blind retry."
  - "TASK-0012 performance telemetry remains authority NONE and cannot determine PASS/FAIL."
  - "No new artifact schema version, lifecycle state, daemon, database, queue, scheduler, cache, service, dependency, organizational role, or Runtime feature is introduced."
  - "agent-runtime, documents/, standards/, profile/.agent/bootstrap/authority.lock.json, profile operator routing, and external-capability identities remain unchanged."

forbidden_changes:
  - "Skip a remote/CI verifier that requires candidate publication."
  - "Claim a local-only candidate is already canonical remote evidence."
  - "Set report publication fields to predict the report commit's own future push."
  - "Collapse candidate and report into one commit."
  - "Rewrite/amend/squash the candidate to add report evidence."
  - "Remove post-publication remote proof or Architect independent review."
  - "Introduce a new compact protocol/task/report dialect."
  - "Modify Execution Attempt schema/semantics, agent-runtime, host services, tunnel-client, documents/, standards/, authority.lock.json, external capability pins, branches, tags, or releases."

