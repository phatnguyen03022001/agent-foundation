acceptance_criteria:
  - id: AC-1
    requirement: "Protocol-v3 explicitly permits one-shot candidate+report publication only when candidate remote visibility is not an evidence prerequisite."
    evidence_required: "Contract/Executor text defines the positive eligibility predicates and concrete two-publication fallback triggers without weakening existing consequence-boundary or verification rules."

  - id: AC-2
    requirement: "The optimized path preserves exact candidate/report identities and remote proof."
    evidence_required: "Deterministic TASK-0013 dogfood or fixture evidence proves local candidate -> local report-only child -> one CAS fast-forward to report commit -> fresh remote report/candidate lineage, with final_execution_head still candidate and report still separate child."

  - id: AC-3
    requirement: "Self-referential report publication remains impossible."
    evidence_required: "Report contract/validator behavior permits truthful candidate-not-prepublished state and still forbids a report from claiming its own same-commit remote publication."

  - id: AC-4
    requirement: "External verifier and cross-checkout cases retain the two-publication path."
    evidence_required: "Positive/negative contract fixtures or regression assertions demonstrate remote-candidate-required cases do not use the optimized path."

  - id: AC-5
    requirement: "Publication failure remains fail-closed and retry-safe."
    evidence_required: "Existing CAS/reconciliation semantics remain normative; contract/tests show ambiguous or failed one-shot publication requires fresh remote reconciliation and never blind retry."

  - id: AC-6
    requirement: "The change reduces synchronization structurally rather than by weakening proof."
    evidence_required: "TASK-0013 performance audit records exactly one candidate/report publication invocation on the eligible happy path, while all required verification predicates and one post-publication remote refresh remain present. No absolute wall-time target is required."

  - id: AC-7
    requirement: "Unrelated Foundation/Runtime authority remains unchanged."
    evidence_required: "Diff/object identity proves execution-attempt telemetry, agent-runtime, documents/, standards/, authority.lock.json, bootstrap routing, external-capability identities, repository topology, and role model are unchanged."

  - id: AC-8
    requirement: "Foundation verification remains green on one coherent final candidate."
    evidence_required: "Relevant protocol/validator regressions, skill-library validation/regressions, bootstrap validation/tests as applicable to changed surfaces, Python compilation for modified scripts, and git diff --check PASS before report authorship."

