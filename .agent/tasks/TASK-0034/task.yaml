    - "Integration case A: use the existing temporary mock repository to declare a single tiny feature outcome/oracle and resolved target-native stdlib choices before dependent fixture implementation. Pre-author one existing fixture component, permitted implementation/test-reliability mutation classes and invariant oracle; authorize fixture-local repairs needed for that outcome, not unrelated components/dependencies/contracts. Create two deliberately defective fixture inputs whose actual deterministic acceptance gate reveals them successively: initial FAIL, repair A leaves FAIL attributable to B, repair B yields PASS under the same unchanged oracle/envelope. Exact local fixture filenames are Executor discretion inside that run-owned component. Record effect intent before one repair, perform the fixture-local change, omit acknowledgement/result as a controlled fault, then reload persisted attempt data and freshly inspect the exact file postcondition. Prove OUTCOME_UNKNOWN itself permits no retry; reconcile EFFECT_PRESENT, preserve the already-present effect without duplicate repair, checkpoint after observation and clear only when legal. Process the next consequence with the same task/revision/base/attempt binding and increasing slice ordinal. No second unresolved slice, scope revision or acceptance weakening is needed for these declared fixture-local repairs."
    - "Integration case B: persist an unresolved keyed-operation slice, simulate a lost result and reload its actual on-disk record through the existing helper, rather than merely constructing a hand-written result dictionary. Exercise fresh=false rejection with unchanged record, fresh UNRESOLVED with no retry, then fresh REPLAY_SAFE_CONTRACT yielding RETRY_ALLOWED for a controlled test-local retained same-key/specification result. The fixture contract establishes recoverability; the helper does not establish authority or actual installed Runtime replay safety. Exercise checkpoint-before-clear and a subsequent independently reconciled external-effect slice: the retained process result cannot certify that separate effect. Resolve present effect without duplicate dispatch. Terminalize NEEDS_REVIEW and prove it cannot reopen RUNNING or admit a new slice. Keep original base, authority NONE and writer ownership explicit. A tiny in-method fake carrier/result or call-count observation is allowed solely for this controlled test, without a reusable controller/store/registry."
    - "Ephemeral fixture authority is explicit: only this task's existing unittest-created run-owned root may contain mock task/design/data/implementation/test files and Git metadata needed for those tests. They are generated mock repositories with fake origin binding, not clones/worktrees of a real GitHub target or new canonical tasks. Fixture-local filesystem mutations and native Git operations follow the existing test harness; no fixture remote network publication, real provider session, live Runtime restart/kill, host setup, dependency acquisition or production takeover is allowed. No target attempt is created in agent-foundation's own .git. Cleanup uses existing test-owned TemporaryDirectory lifecycle; preserve material diagnostic evidence with identity if needed."
