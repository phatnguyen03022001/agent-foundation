invariants:
  - "Target repository remains the semantic owner of product truth."
  - "Foundation consumes product state; it never becomes product-state authority."
  - "Architect planning follows target phase + earliest materially blocking condition by default."
  - "UNKNOWN remains UNKNOWN; missing evidence never becomes progress."
  - "Current agent-foundation planning result is P0_SCOPE / release.status."
  - "Task lifecycle remains distinct from feature/system/project state."
  - "No universal target manifest or filename requirement is introduced."
  - "No second phase/blocker engine, planner service, scheduler, daemon, queue, workflow engine, central state database, or cross-repository mutable state is introduced."
  - "No execution/UI recovery semantics are added in T5."
  - "No T6 adoption-closure artifact is created."

forbidden_changes:
  - "Modify product-state.json or AGENT_FOUNDATION_PRODUCT_STATE.md."
  - "Make Foundation the owner of release scope, feature registry, feature state, system gates, or project phase."
  - "Require every target to expose product-state.json or agent-foundation schema 3."
  - "Use task/report/review/chat/Runtime status as product-state evidence by implication."
  - "Permit Architect to choose later-phase work while an earlier canonical blocker remains unresolved, absent exact higher-priority authority."
  - "Silently overwrite or bypass UNKNOWN."
  - "Add phase/blocker fields to task protocol or task schema merely for convenience."
  - "Create a new planner/orchestrator/runtime service or persistent planning database."
  - "Modify TASK_PROTOCOL.md, Executor semantics, execution continuity/recovery, agent-runtime, host state, dependencies, credentials, branches, tags, releases, or repository metadata."
  - "Create TASK-0023/T6 artifacts."

