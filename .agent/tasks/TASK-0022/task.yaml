    requirement: "Foundation has an explicit filename-neutral target-product progression consumption boundary without taking product ownership."
    evidence_required: "FOUNDATION_ARCHITECTURE.md states target-owned progression inputs, consumption/verification/selection permissions, UNKNOWN behavior, and anti-ownership constraints; no universal manifest/schema requirement is introduced."

  - id: AC-2
    requirement: "Architect has an exact pre-planning read protocol and progression rule."
    evidence_required: "Architect skill resolves the ten canonical read steps in order, uses fresh target evidence, preserves UNKNOWN, and defaults to earliest materially blocking work rather than generic useful work."

  - id: AC-3
    requirement: "Architect task generation remains bounded and authority-aware."
    evidence_required: "Role-local procedure binds selected blocker to existing Executor-fit + WHAT/BOUNDARY/PROOF task rules, distinguishes explicit higher-priority override, and does not add schema/lifecycle fields or merge product/task state."

  - id: AC-4
    requirement: "Accepted T4 semantics are actually consumed, not duplicated or weakened."
    evidence_required: "Focused regressions reuse T4 derivation/blocker semantics and prove current canonical state selects P0_SCOPE/release.status, later-phase fixtures select their target-defined earliest blockers, and no second progression engine is added."

  - id: AC-5
    requirement: "T5 preserves all existing ownership and product-state boundaries."
    evidence_required: "product-state.json, AGENT_FOUNDATION_PRODUCT_STATE.md, TASK_PROTOCOL.md, Executor skill, T1-T4 product contracts/state, protected domains, historical tasks, external pins, and Runtime/host state remain unchanged."

  - id: AC-6
    requirement: "All affected qualification is green on one coherent final candidate."
    evidence_required: "Task validation, focused T5 plus existing T2-T4 regressions, full skills/protocol validator/regressions, external sync/regressions, profile bootstrap local/remote/regressions, documents tests, standards verifier with existing qualified interpreter, modified Python compile, internal links, protected/history checks, exact scope proof, and git diff --check PASS."

