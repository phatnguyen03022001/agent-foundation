structure_authority:
  status: RESOLVED
  source: "AGENT_FOUNDATION_PLAN.md sections 24-28, 32-39, 44-48 plus accepted T4"
  rationale: "T5 integrates target-owned product-state progression into Foundation/Architect planning procedure. It does not create another state model, planner service, task schema, runtime mechanism, or execution-recovery layer."

objective: "Make Foundation and Architect consume canonical target-owned product state before material planning: resolve the exact release/scope/required feature set/registry/feature evidence/system gates/derived phase/earliest blocker in the canonical order, then authorize work against the earliest materially blocking condition unless explicit higher-priority current authority overrides it. Preserve target ownership, filename-neutral discovery, existing Task Protocol semantics, and accepted T1-T4 product truth. Do not implement execution/UI recovery or dogfood closure."

scope:
  required_changes:
    - "Add a bounded generic product-progression consumption contract to skills/contracts/FOUNDATION_ARCHITECTURE.md under existing Foundation governance ownership. Foundation may discover and consume target-owned product state, verify/derive target-defined phase when applicable, select the target-defined earliest blocker, and create bounded task authority; it must never become the owner of product state."
    - "The generic Foundation contract must remain filename-neutral. Do not require product-state.json, a universal manifest, one schema version, one language, or one validator implementation for arbitrary targets. Agent-foundation's product-state.json is only this target's current implementation."
    - "Update skills/architect/SKILL.md with an explicit pre-planning product progression read protocol. Before material task selection, Architect must resolve in order: exact target repository; exact canonical release identity when one exists; release scope status; required release feature set; canonical feature registry; feature states and evidence; global system gates; derived project phase; earliest materially blocking condition; applicable target-native architecture/tooling/verifier contracts."
    - "Architect must use fresh target-owned evidence, not memory, prior chat, task status, report/review status, Runtime state, or generic framework assumptions to fill missing product facts."
    - "If a material product-state fact is missing, contradictory, stale, or inaccessible, Architect must preserve UNKNOWN or surface the actual authority/specification blocker; it must not invent feature state, release scope, gate PASS, phase, or blocker to enable task creation."
    - "Where the target stores a derived phase or blocker and also exposes deterministic derivation semantics, Architect must verify consistency before using the projection. Contradiction is stale/invalid target truth and blocks material planning until reconciled; do not silently choose whichever representation is convenient."
    - "Architect progression selection must target the earliest materially blocking condition for the bound release/target state. Later feature verification, hardening, production, technical debt, cleanup, or generic useful work must not bypass an earlier phase blocker."
    - "An explicit higher-priority override is permitted only when it is current, exact, and authoritative for the requested work. Architect must keep the override distinguishable from the default progression result in the task authority/evidence instead of silently rewriting product state."
    - "After selecting a progression condition, Architect must apply the existing Executor-fit and bounded-task rules: one coherent progression objective, bounded mutation scope, explicit terminal proof boundary, and split independent outcomes when required. T5 must not add a task schema field merely for phase/blocker metadata."
    - "Task acceptance/review does not update product state by implication. After task completion, fresh target-owned evidence remains required before any feature gate/state/system gate/project phase changes."
    - "For the current agent-foundation canonical state, fresh regression proof must show the Architect consumption result is phase P0_SCOPE and earliest blocker release.status. F002/F004 verification and later global gates must not be selected ahead of this blocker."
    - "Current P0 planning semantics must not authorize inventing/finalizing release truth without evidence. A bounded follow-on task for release scope may resolve missing release identity/required features only from target-owned authority and must preserve UNKNOWN when unresolved."
    - "Add deterministic regressions that bind Architect/FOUNDATION text semantics to the accepted T4 resolver: current P0/release.status case; later-phase blocker cases; no-later-work-bypass marker; explicit-override distinction; UNKNOWN preservation; task/product-state separation; filename-neutral target discovery."
    - "Prefer semantic contract tests over adding a planner service. Reuse accepted T4 pure derivation/blocker helpers for target-specific regression fixtures rather than implementing a second progression engine."
    - "Keep TASK_PROTOCOL.md byte-for-byte unchanged unless execution proves a direct contradiction that cannot be resolved within Foundation Architecture + Architect role-local procedure; if such a contradiction exists, stop BLOCKED rather than widening scope."
    - "Keep product-state.json and AGENT_FOUNDATION_PRODUCT_STATE.md byte-for-byte unchanged. T5 consumes T4 truth; it does not mutate product state."
    - "Keep Executor skill bodies, seven-skill taxonomy, rationalization/external metadata, documents/, standards/, profile authority.lock, TASK-0014..0021 historical artifacts, agent-runtime, Runtime/host state, credentials, branches, tags, releases, and repository metadata unchanged."
    - "Publish implementation/report on main only by ordinary non-force fast-forward."

