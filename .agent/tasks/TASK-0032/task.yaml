    - "Extend only Task Protocol's existing Structure authority applicability section with a concise pre-authoring boundary. Start from applicable target feature/acceptance/contracts and one independently reviewable outcome/proof; FE/BE/data work may share that outcome when required, rather than generating unrelated folder tasks. Use the existing Executor-fit judgment for independent outcomes or unavailable current-phase capabilities. Keep input owners, dependencies, relevant HOW, permitted consequences and terminal proof bounded for the selected outcome; do not preload unrelated features or claim numeric ChatGPT budgets/timing. ECC retains the generic HOW of vertical-slice decomposition."
    - "Before authoring implementation scope, distinguish resolved material decisions, still-open facts that could change the boundary, and non-material implementation discretion. Resolve boundary-changing facts through existing read-only research or explicitly authorized bounded discovery/probes when necessary. When stabilization can safely proceed despite unknown exact defect/file identities, Architect may pre-author a fixed objective, existing component/ownership boundary, permitted mutation classes, protected invariants, evidence and stop conditions using existing task fields. Material architecture, public/shared contracts, dependencies, ownership, trust/privilege or acceptance-oracle changes remain outside that envelope unless already explicitly authorized. Do not invent exact files, dependencies or architecture to make unknowns disappear."
    - "Compose that envelope from objective, scope.required_changes, scope.allowed_existing_files_or_components, structure_authority, existing optional restrictive controls, invariants/forbidden_changes, gap_policy, acceptance_criteria and verification; no new formal mode/schema/field. Exact repository, branch, task revision and execution base remain mandatory in all cases. Restrictive exact-file scope stays a hard boundary when explicitly selected and justified by known material consequences; it is not the default for unknown local companions. Preserve explicit new-file/structure restrictions. Omission of exact-file prescription never grants unrelated scope, new components, dependencies or new material authority."
    - "Apply the existing LOCAL rule to a newly found defect only when it is necessary for current acceptance, fully inside the pre-authored component and permitted mutation class, non-governing and deterministically verifiable. Multiple sequential in-scope defects may be fixed/proven under that same task, with the required gate rerun after relevant changes. Scope-expansion forbidden still stops every out-of-envelope consequence. Test-reliability fixes may preserve and improve proof, never weaken an oracle, skip a gate or redefine acceptance merely to pass. Executor reports discovered local companions and proof for Architect review; it cannot redefine the envelope. Unavailable capability cannot be solved by wider authority, and unknown mutation effects require existing reconciliation before retry."
    - "Append only a short owner cross-reference from the existing Material-design-readiness gate to Structure authority applicability; leave its three accepted governing paragraphs unchanged. Add a concise skills README locator for bounded task authoring. Both role kernels remain byte-identical, including Architect 16656 and Executor 17359. Existing scope/defaults/gap semantics remain at their owners; do not duplicate an entire normalization table, implementation contract or ECC methodology."
    - "Persist four concrete synthetic walkthroughs in the report: (1) a target-defined feature outcome spans required FE/API/data contracts and is accepted/proven as one bounded outcome, with unrelated future feature facts excluded; (2) a pre-authored packaging/release-fixture objective discovers two sequential implementation/test-reliability defects in declared components/classes, both LOCAL with proof and no authority revision; (3) the same discovery under explicit restrictive exact-file/structure controls is outside authority and cannot bypass them, while a new dependency/public-contract/privilege change also requires revised authority; (4) an unprobed material fact selects bounded discovery, a missing mandatory environment capability remains capability-blocked, and an unknown mutation effect selects reconciliation instead of scope expansion or blind retry. Record given target facts, exact relevant authorizing field excerpts, discovered consequence, predicate-by-predicate disposition and proof/stop result. Keep the examples synthetic, not actual Runtime audit or product execution."
    - "For the component-envelope and restrictive counterpart, validate two non-executable synthetic DRAFT task fixtures against the unchanged native v3 artifact validator and show the unchanged normalizer's effective restrictive/default controls. Use only existing supported fields; Git mutations remain false and execution_ready false. Temporary fixture files outside the tracked repository are allowed for this verification; do not publish new task templates or .agent task authorities. Persist the meaningful fixture inputs/source-template identity and validation/default receipts compactly in the report so the comparison is reconstructible. Syntax PASS is not a semantic scope/authority decision; the walkthrough must separately justify LOCAL versus out-of-boundary disposition."
    - "Keep net UTF-8 addition across the two authorized files <=4000 bytes; generic HOW and field boilerplate are not copied. Run native skills validator, full existing skills 240/240 and external 26/26, task/report artifact validation, the two synthetic artifact/default checks, new relative link/anchor resolution, exact section-edit/protected scope/inventory checks and git diff --check. No source-code/test mutation, live metadata refresh, Runtime/host/dependency change or unrelated Documents/Standards reruns absent new input invalidation. Do not add tests that merely mirror new prose."
    - "Commit the qualified two-file candidate as direct child of exact handoff base, then its sole report-only child. Apply existing protocol-v3 publication eligibility and truthful candidate-prepublication pushed state. After ordinary non-force MAIN_ONLY publication, fresh closure has local main, origin/main and remote main equal the report commit, one worktree, tracked/index cleanliness and pinned .DS_Store. Finish NEEDS_REVIEW and stop before continuation/recovery redesign, dogfood or successor execution."
