structure_authority:
  status: RESOLVED
  source: "AGENT_FOUNDATION_PLAN.md sections 2-12 and 39-40, reconciled with existing agent-foundation structure"
  rationale: "T1 establishes semantic product architecture boundaries only. Literal directory names are not required. Existing Foundation governance architecture remains a separate owner; this task must not absorb T2-T6 product-state/progression/governance-integration work."

objective: "Adopt the T1 product-architecture boundary model for agent-foundation as its own target repository without forcing reference directory names or prematurely implementing release scope, feature registry, feature-state derivation, project-phase progression, Foundation consumption integration, or dogfood closure. Establish one canonical target-owned product architecture contract that defines semantic ownership for product capabilities, reusable shared capabilities, platform/runtime-operational capabilities, composition/bootstrap concerns, dependency direction, cross-capability contracts, cross-cutting ownership, telemetry ownership, and evidence-based extraction/no-premature-infrastructure rules. Reconcile those semantics with the repository's existing profile/, skills/, documents/, standards/ domains rather than inventing business features or restructuring merely to resemble the reference tree."

scope:
  required_changes:
    - "Inspect current agent-foundation product/repository structure and classify existing durable product capabilities by semantics before editing. Do not derive ownership from directory names alone."
    - "Create at most one canonical target-product architecture contract under skills/contracts/ if the existing FOUNDATION_ARCHITECTURE.md cannot remain a clean governance/control-plane owner while also expressing target-product architecture. Prefer separation over turning FOUNDATION_ARCHITECTURE.md into a mega-document."
    - "Define the target-specific equivalent of the plan's modular-monolith + vertical-slice + shared-capability + platform-capability + composition-root model. Literal features/shared/platform/app directories are not required; existing repo-native names may remain."
    - "Define feature/product-capability ownership: capability-local product/business/governance semantics remain with the owning product capability and do not migrate to shared merely because multiple files in one capability reuse them."
    - "Define shared-capability admission exactly as reusable by at least two independent product capabilities, no capability-specific product semantics, and a stable reusable contract. Reject dumping grounds such as common/utils/everything semantics."
    - "Define platform/runtime-operational capability ownership as execution/infrastructure/operational mechanics only; platform must not own product/governance behavior merely because it executes or hosts it."
    - "Define composition/bootstrap ownership as wiring, registration, navigation/entrypoints, and configuration composition only; product/governance behavior must not accumulate in composition roots."
    - "Define dependency direction and cross-capability contracts so one product capability does not depend on another capability's private internals by default; interaction uses explicit public contracts, application interfaces, events, or explicit orchestration."
    - "Define cross-cutting ownership for security, reliability, telemetry, testing, configuration, delivery/operations in a way that separates target-specific semantics from reusable mechanics and operational infrastructure."
    - "Define telemetry ownership at three semantic levels when applicable: product-capability semantic events, shared instrumentation mechanics, and platform observability infrastructure."
    - "Preserve the plan's no-premature-infrastructure and extraction rules: no microservices/distributed orchestration/infrastructure expansion without demonstrated independent operational boundaries; extraction requires concrete evidence such as independent scaling, failure isolation, deployment, security, storage, latency, or organizational ownership."
    - "Add deterministic regression coverage proving semantic ownership is filename-neutral, literal reference directories are optional, shared admission is restrictive, platform/composition cannot absorb product behavior, private cross-capability imports are rejected by doctrine, and premature extraction is not a default."
    - "Explicitly encode that TASK-0018 does NOT implement release scope/feature registry, feature lifecycle/gates/state derivation, global system gates/project phases, Architect progression integration, execution/UI recovery changes, or adoption closure. Those remain separate future acceptance boundaries."
    - "Keep TASK-0014 through TASK-0017 historical task/report/review artifacts unchanged. Keep ECC/external-capability metadata, seven-skill taxonomy, documents/, standards/, bootstrap authority lock, agent-runtime, Runtime/host state, credentials, branches, tags, and releases unchanged."
    - "Publish implementation/report on main only by ordinary non-force fast-forward."

  allowed_existing_files_or_components:
    - "skills/contracts/AGENT_FOUNDATION_PRODUCT_ARCHITECTURE.md"
    - "skills/contracts/FOUNDATION_ARCHITECTURE.md only for a concise ownership/navigation link if needed"
    - "skills/README.md only for concise contract navigation"
    - "README.md only for concise target-product architecture navigation"
    - "skills/scripts/validate_skill_library.py only if deterministic doctrine validation requires it"
    - "skills/scripts/test_validate_skill_library.py"
    - ".agent/tasks/TASK-0018/**"

  expected_files_are_restrictive: false

invariants:
  - "agent-foundation is the exact target repository and therefore owns its product truth."
  - "Foundation governance/control-plane architecture remains distinct from agent-foundation target-product architecture; target-product adoption must not collapse product state, task/governance state, execution state, or UI state."
  - "Existing profile/, skills/, documents/, standards/ physical domains are not renamed/reorganized merely to resemble the reference tree."
  - "Filename-based authority remains forbidden."
  - "No feature/product capability is invented only to satisfy the reference architecture."
  - "No release scope, feature registry, persisted feature state, project phase engine, central state database, workflow engine, scheduler, daemon, queue, or new orchestration framework is introduced."
  - "TASK-0015 seven-skill taxonomy remains unchanged."
  - "skills/.agent/external-capabilities/** remains byte-identical to the execution base."
  - "documents/, standards/, profile/.agent/bootstrap/authority.lock.json, agent-runtime, Runtime/host state, credentials, branches, tags, and releases remain unchanged."
  - "One initiating chat/session is never treated as durable product, task, execution, or architecture truth; T1 artifacts and proof must remain reconstructible from repository state."

forbidden_changes:
  - "Create T2-T6 task artifacts or partially implement their state/progression/integration/closure semantics."
  - "Force literal src/features, src/shared, src/platform, or src/app directories merely because the reference plan shows them."
  - "Invent fake business features for profile/, skills/, documents/, or standards/."
  - "Turn shared into a misc/common/utils dumping ground or move capability-specific semantics there for convenience."
  - "Move product/governance semantics into Agent Runtime, platform/execution substrate, bootstrap composition, ECC, or generic external methodology."
  - "Introduce microservices, event sourcing, CQRS, Kafka, Kubernetes, service mesh, workflow engine, central state service, scheduler, daemon, queue, orchestration database, or custom agent framework without a demonstrated current requirement."
  - "Modify Architect/Executor progression behavior, task/product-state derivation, execution recovery, or UI failure semantics in this task."
  - "Modify ECC/external pins, rationalization, documents/, standards/, authority.lock.json, agent-runtime, Runtime/tunnel state, credentials, host security state, branches, tags, releases, or repository metadata."

