  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "agent-foundation has one canonical target-owned product architecture boundary contract distinct from the existing Foundation governance/control-plane contract."
    evidence_required: "Contract/navigation diff and doctrine tests prove the separation and identify the target-owned semantic architecture without creating a mega-document or duplicate authority."

  - id: AC-2
    requirement: "Product-capability, shared, platform, and composition ownership are explicit and filename-neutral."
    evidence_required: "Tests and contract examples prove semantics survive alternate directory names, prohibit invented feature ownership from filenames, and preserve existing repo-native physical domains."

  - id: AC-3
    requirement: "Shared and cross-capability boundaries prevent semantic leakage."
    evidence_required: "Regression cases prove shared admission requires at least two independent consumers, no capability-specific semantics, stable reusable contract, and cross-capability interaction through explicit public contracts/interfaces/events/orchestration rather than private internals."

  - id: AC-4
    requirement: "Cross-cutting and telemetry ownership separate target semantics, reusable mechanics, and operational infrastructure."
    evidence_required: "Contract/test matrix covers security, reliability, telemetry, testing, configuration, delivery/operations and the semantic-event/instrumentation/observability split without transferring product truth to platform/runtime."

  - id: AC-5
    requirement: "No-premature-infrastructure and extraction rules remain evidence-based."
    evidence_required: "Negative doctrine tests reject distributed/extracted architecture as a default and require a demonstrated independent operational boundary before extraction."

  - id: AC-6
    requirement: "T1 remains one bounded acceptance boundary and does not pre-implement T2-T6."
    evidence_required: "Base-to-candidate diff and negative tests show no release registry/state machine/project phase/progression integration/recovery/closure implementation and no future task artifacts."

  - id: AC-7
    requirement: "Existing accepted Foundation governance, ECC seam, taxonomy, protected domains, and execution substrate remain unchanged except for the narrow product-architecture navigation needed by T1."
    evidence_required: "Exact object/diff proof for external-capability metadata, rationalization, documents/, standards/, authority.lock.json and repository scope; existing full Foundation regressions remain green."

  - id: AC-8
    requirement: "All affected deterministic verification is green on one coherent final candidate."
    evidence_required: "Task artifact validation, focused T1 doctrine tests, full skill/protocol validator and regressions, external seam checks, bootstrap validation/regressions including remote when supported, Python compilation for modified scripts, internal-link validation, and git diff --check PASS."

