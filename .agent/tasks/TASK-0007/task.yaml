  executor_checks:
    - id: CHECK-1
      command_or_check: "Validate TASK-0007 with the canonical task artifact validator before any implementation mutation."
      required: true
    - id: CHECK-2
      command_or_check: "python3 -B profile/.agent/bootstrap/validate.py"
      required: true
    - id: CHECK-3
      command_or_check: "python3 -B profile/.agent/bootstrap/validate.py --remote"
      required: true
    - id: CHECK-4
      command_or_check: "python3 -B profile/.agent/bootstrap/test_bootstrap.py"
      required: true
    - id: CHECK-5
      command_or_check: "python3 -B skills/scripts/validate_skill_library.py and python3 -B skills/scripts/test_validate_skill_library.py"
      required: true
    - id: CHECK-6
      command_or_check: "Run the new external-capability sync/index test suite, including deterministic regeneration from the exact four pinned upstream revisions and negative tests for excluded/unsafe upstream surfaces."
      required: true
    - id: CHECK-7
      command_or_check: "Run Sync check mode against committed registry/snapshots/catalog and prove byte-identical deterministic output; perform no upstream code execution."
      required: true
    - id: CHECK-8
      command_or_check: "Prove authority.lock remains byte-identical to execution base, bootstrap has no active external ecosystem capability routes, skill taxonomy remains exactly 15, and no forbidden upstream content or Runtime mutation appears in the candidate diff."
      required: true
    - id: CHECK-9
      command_or_check: "python3 -m py_compile for new/modified Python files and git diff --check."
      required: true
    - id: CHECK-10
      command_or_check: "Fresh-resolve remote main immediately before non-force publication, then post-prove final main identity, ahead/behind, tracked worktree hygiene, and report publication."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

