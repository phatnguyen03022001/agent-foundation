      required: true
    - id: CHECK-5
      command_or_check: "Run focused deterministic assertions for exactly two organizational roles, the three-layer architecture contract, Sync/Researcher specialization boundaries, and capability-state non-equivalence invariants."
      required: true
    - id: CHECK-6
      command_or_check: "Prove cold bootstrap/capability navigation resolves only canonical Foundation paths at immutable authority and fails closed for malformed or missing new control-plane navigation."
      required: true
    - id: CHECK-7
      command_or_check: "Prove changed paths contain no external vendoring, no internal skill retirement/addition, no agent-runtime mutation, and no forbidden orchestration infrastructure; run git diff --check."
      required: true
    - id: CHECK-8
      command_or_check: "Fresh-resolve remote main immediately before canonical publication and post-prove final main identity, ahead/behind, worktree hygiene, and report publication."
      required: true
    - id: CHECK-9
      command_or_check: "Prove authority.lock contains no Foundation-internal semantic-owner pins; prove cold bootstrap reconstruction binds every internal canonical route to the one exact Foundation authority_set_identity revision and keeps agent-runtime as the separately pinned external authority."
      required: true
