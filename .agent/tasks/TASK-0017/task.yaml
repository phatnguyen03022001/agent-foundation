invariants:
  - "Foundation remains MAIN_ONLY with exactly two organizational roles: Architect and Executor."
  - "The accepted seven-skill internal taxonomy remains unchanged."
  - "Exact-pinned ECC remains bf70150eb2df8070024e5bdf08e4aa08959e2735 with existing inert authority-NONE semantics; no external pin or snapshot changes."
  - "The target repository remains canonical owner of product truth and repo-native engineering contracts."
  - "Foundation remains governance/control and never becomes target product/toolchain/runtime authority."
  - "ECC remains generic engineering HOW after target truth and never becomes L0 or target authority."
  - "Agent Runtime and other carriers remain execution transports/capabilities; carrying an operation never grants semantic product authority."
  - "GitHub remote remains canonical durable repository state; local observations remain subordinate under existing drift/evidence rules."
  - "Accepted and BLOCKED historical outcomes are replayed as facts, not re-litigated or rewritten."
  - "No closure result may be manufactured by weakening a historical target invariant, ignoring a blocker, changing case selection after failure, or patching governance during qualification."
  - "agent-foundation source/governance bytes remain unchanged from the TASK-0017 execution base on the happy path except for the new report artifact."
  - "agent-runtime repository/product bytes and live Runtime/host state remain unchanged by TASK-0017."
  - "documents/, standards/, authority.lock.json, bootstrap, rationalization, external-capability metadata, skills, protocols, templates, validators, Agent Runtime, credentials, host security state, branches, tags, releases, and external repositories are not mutated."

