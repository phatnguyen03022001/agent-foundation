structure_authority:
  status: RESOLVED
  source: "TASK-0014 through TASK-0016 accepted architecture plus existing protocol-v3 evidence model"
  rationale: "This is a qualification/closure task, not a new product feature. It needs no new Foundation subsystem, schema, skill, manifest, benchmark harness, or cross-repository mutation mechanism. The durable output is the existing report/review lifecycle only."

objective: "Independently dogfood and close the current Foundation vision without changing governance or target product bytes. Replay four immutable real agent-runtime cases under the accepted TASK-0014/TASK-0015/TASK-0016 contracts, then perform one fresh read-only reconstruction against current agent-runtime/main. Prove that target-repository product truth and repo-native commands remain primary, Foundation supplies governance/control, exact-pinned ECC supplies generic engineering HOW only after target truth, Agent Runtime or another carrier remains execution transport rather than semantic authority, GitHub remote remains durable canonical repository state, and blocked conditions fail closed without weakening product/security constraints. If every predicate passes, produce a report-only NEEDS_REVIEW closure candidate for independent Architect acceptance. If any material architecture/ownership/evidence defect is found, stop BLOCKED and record the exact follow-up need; do not patch Foundation or agent-runtime inside TASK-0017."

dogfood_cases:
  replay_intent: "Read-only immutable evidence replay; these cases are evidence inputs, not target authority for agent-foundation."
  cases:
    - "agent-runtime TASK-0174 revision 2 ACCEPTED: native onboarding feature with secret-handling, UI, lifecycle, repo-native verification, and zero live consequence constraints."
    - "agent-runtime TASK-0175 revision 2 ACCEPTED: unchanged product candidate requalified after verifier-carrier contamination; proves source preservation and repo-native verifier authority."
    - "agent-runtime TASK-0180 revision 2 ACCEPTED: disposable host/runtime architecture qualification with process ownership, exact teardown, and report-only repository closure."
    - "agent-runtime TASK-0176 revision 1 BLOCKED: zero-cost distribution viability gate where unchanged product/security constraints could not be proven and execution stopped before weakening semantics."

scope:
  required_changes:
    - "Before any closure judgment, validate TASK-0017 and prove agent-foundation local HEAD/origin/main still match the exact authorized execution base with a clean worktree."
    - "Resolve each immutable replay source by exact agent-runtime commit listed in authority_sources. Read the exact task revision, report revision, review state, candidate/base identities, acceptance evidence, and materially relevant source/verification facts. Do not substitute current mutable main or chat memory for those immutable case bytes."
    - "For TASK-0174, prove the current Foundation model correctly assigns product/UI/runtime_config/cutover/doctor semantics and repo-native tests/verify to agent-runtime; Foundation task/review authority to governance; generic engineering methodology only to L2 external HOW; and the selected execution carrier no product authority."
    - "For TASK-0175, prove the model preserves the exact unchanged source candidate when failure belongs to verifier-carrier contamination, treats the target-owned ./verify contract as primary, permits a separately authorized clean carrier, and does not prescribe source mutation merely to make a generic harness happy."
    - "For TASK-0180, prove the model can distinguish agent-runtime as the product being qualified from the execution carrier used to inspect/run the qualification. Product process ownership, payload/substrate contracts, and teardown semantics remain target-owned; carrier identity supplies capability only."
    - "For TASK-0176, prove fail-closed governance: when the target's existing ServiceManagement/provenance/security invariants conflict with the requested zero-cost distribution constraint, Foundation does not weaken product truth, invent a fake authority, silently replace lifecycle semantics, or treat generic HOW as permission to proceed."
    - "For every replay, explicitly classify which evidence is target product truth, exact task authority, repo-native verification/tooling, Foundation governance, generic external HOW, execution transport, and remote canonical truth. Any ambiguous dual owner or authority transfer is a material closure defect."
    - "Perform one fresh read-only pilot against phatnguyen03022001/agent-runtime main at execution time. Fresh-fetch main, record the exact remote SHA in report evidence, and inspect only the minimum applicable target-native surfaces needed to reconstruct product/toolchain/verifier/task authority from repository bytes without relying on prior chat memory."
    - "The fresh pilot must demonstrate filename-neutral discovery: identify actual applicable task/product/architecture/toolchain/dependency/build/test/verify/runtime/deployment surfaces present at that exact SHA, distinguish conventional filenames from authority classes, and show that missing conventional files would not itself be blocking if equivalent repo-native truth is available."
    - "For the fresh pilot, identify at least one currently relevant generic engineering methodology need and resolve its exact-pinned ECC capability through the accepted external-capability metadata without installing/configuring/updating ECC and without allowing that capability to override target-native commands or current task authority."
    - "The fresh pilot is read-only with respect to agent-runtime product/repository truth. git fetch and other bounded observation are permitted; commits, worktree edits, Runtime/service/config/tunnel mutation, process lifecycle mutation, dependency installation, credentials, Apple authority, tags, releases, and target-ref mutation are forbidden."
    - "Evaluate the current Foundation itself for closure only from immutable accepted TASK-0014/0015/0016 evidence plus fresh local canonical validators. Do not re-rationalize skills, update pins, redesign ownership, or make cleanup edits."
    - "Happy-path execution must leave all pre-existing agent-foundation product/governance files byte-identical to the execution base. final_execution_head may equal the exact TASK-0017 planning/base commit; the only canonical execution output should be .agent/tasks/TASK-0017/report.yaml as its report-only child."
    - "If a material mismatch, semantic loss, authority ambiguity, weaker safety/proof path, or target/ECC/Foundation/Runtime ownership defect is discovered, do not repair it in this task. Produce a truthful BLOCKED report with exact evidence and the smallest follow-up boundary."
    - "If all closure predicates pass, produce NEEDS_REVIEW. Executor must not declare the vision ACCEPTED or maintenance-complete; only the independent Architect review may make that terminal governance judgment."
    - "Publication remains main-only, ordinary non-force fast-forward, after fresh remote reconciliation."

  allowed_existing_files_or_components:
    - ".agent/tasks/TASK-0017/**"

