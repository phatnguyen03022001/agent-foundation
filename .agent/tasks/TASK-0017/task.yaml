acceptance_criteria:
  - id: AC-1
    requirement: "The four immutable agent-runtime replay cases are resolved exactly and preserve their canonical ACCEPTED/BLOCKED outcomes, identities, and evidence boundaries."
    evidence_required: "Exact commit/path resolution for all four review artifacts, exact task/report/review revisions and states, relevant candidate/base/report identities, and Git proof that replay used immutable case bytes rather than mutable substitutes."

  - id: AC-2
    requirement: "Historical replay demonstrates correct ownership separation across real feature implementation, verifier correction, runtime/platform qualification, and a fail-closed product/platform conflict."
    evidence_required: "Per-case ownership matrix in report acceptance evidence identifies target product truth, task authority, repo-native tooling/verifier, Foundation governance, external generic HOW, execution carrier, and remote truth with no ambiguous dual owner or authority transfer."

  - id: AC-3
    requirement: "The current target-repository contract works from a fresh read-only bind against current agent-runtime/main without relying on chat memory or conventional filenames as authority."
    evidence_required: "Report records fresh exact agent-runtime remote SHA, bounded discovered repo-native authority/toolchain/verifier/runtime surfaces, filename-neutral precedence, and the exact evidence used to decide what is target truth versus generic HOW."

  - id: AC-4
    requirement: "Exact-pinned ECC can supply a relevant generic engineering capability in the fresh pilot without replacing target commands, requiring ECC CLI installation/configuration, or gaining authority."
    evidence_required: "Exact external-capability catalog/source identity and selected skill/command/agent surface at bf70150... plus a concrete mapping showing target-native commands/architecture remain primary and no harness mutation occurred."

  - id: AC-5
    requirement: "Fail-closed behavior remains materially correct."
    evidence_required: "TASK-0176 replay and at least one adversarial ownership check prove Foundation does not weaken product/security invariants, invent authority, retry unknown effects, or convert capability availability into permission when proof is missing or contradictory."

  - id: AC-6
    requirement: "TASK-0014, TASK-0015, and TASK-0016 accepted contracts remain internally coherent and fully green with no closure-time source edits."
    evidence_required: "Fresh Foundation task/report-capable validator, full skill/protocol regressions, external sync/check regressions, bootstrap local/remote validation/regressions, and object proof for seven-skill taxonomy, target contract, ECC seam, and protected domains."

  - id: AC-7
    requirement: "Closure qualification causes zero product/governance/live-runtime side effects."
    evidence_required: "Base-to-final_execution_head identity/diff proves no Foundation source/governance mutation; agent-runtime pre/post remote/local identity and worktree proof shows read-only use only; no Runtime/service/config/tunnel/dependency/credential/Apple/tag/release effect."

  - id: AC-8
    requirement: "The terminal Executor result is truthful and reviewable."
    evidence_required: "If AC-1 through AC-7 all PASS, report result is NEEDS_REVIEW and the sole report-only child of the unchanged execution base/candidate. Any material failed predicate instead produces BLOCKED with exact follow-up boundary; no self-acceptance or maintenance declaration."

