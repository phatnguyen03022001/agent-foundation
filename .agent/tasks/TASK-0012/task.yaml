invariants:
  - "Foundation remains MAIN_ONLY with exactly two organizational roles: Architect and Executor."
  - "Performance attribution has authority NONE and cannot affect correctness, PASS/FAIL, acceptance, retry legality, task authority, capability authority, publication, promotion, or release."
  - "Default non-audit Executor/Architect hot paths remain free of mandatory performance markers."
  - "No claim of hidden model thinking time or model-active duration is introduced."
  - "UNATTRIBUTED time remains explicit when coverage is incomplete."
  - "Existing Execution Attempt RUNNING/TERMINAL lifecycle, lease semantics, current_slice semantics, and no-blind-retry rules remain unchanged."
  - "Existing canonical report/review operational_timing remains opt-in and stores only trustworthy start/terminal RFC3339 UTC timestamps, never elapsed seconds."
  - "No telemetry payload contains secrets, prompts, transcripts, argv, environment, repository content, raw logs, diffs, file bodies, or broad inventories."
  - "No new daemon, service, database, queue, scheduler, background process, collector, dashboard, third-party dependency, organizational role, or Foundation layer."
  - "agent-runtime, documents/, standards/, profile/.agent/bootstrap/authority.lock.json, and external capability source identities remain unchanged."

forbidden_changes:
  - "Make performance telemetry mandatory for ordinary tasks."
  - "Call CONTROLLER_OWNED model-active, thinking time, inference time, or another unobservable model-internal duration."
  - "Infer timing from Git commit timestamps, conversation timestamps, lease expiry, or missing telemetry."
  - "Record per-tool transcripts or unbounded event history."
  - "Add arbitrary phase/activity labels supplied by users or tasks."
  - "Persist derived performance durations as correctness evidence or use them to gate acceptance."
  - "Merge Architect review timing into Executor attempt telemetry."
  - "Modify agent-runtime, Runtime telemetry, tunnel-client, host services, Runtime configuration, or installed software."
  - "Modify documents/, standards/, authority.lock.json, bootstrap routing, ECC catalog/source pins, branches, tags, releases, or repository topology."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: revised_contract_required
  dependency_change: forbidden
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

acceptance_criteria:
  - id: AC-1
    requirement: "Performance attribution is opt-in and default execution behavior remains unchanged."
    evidence_required: "Tests prove an ordinary attempt requires no performance markers/backend and current task/report/review semantics remain valid; explicit performance-audit operations alone create timing segments."

  - id: AC-2
    requirement: "Phase/activity timing is bounded, deterministic, and privacy-safe."
    evidence_required: "Schema/tool tests prove only fixed phases, fixed activity classes, captured UTC boundaries, one open segment, <=32 completed segments, authority NONE, and rejection of arbitrary/high-risk payload fields."

  - id: AC-3
    requirement: "Derived attribution is truthful rather than overclaimed."
    evidence_required: "Deterministic fixture proves wall-time, per-phase, CONTROLLER_OWNED, EXTERNAL_WAIT, instrumented coverage, and UNATTRIBUTED calculations; incomplete/interrupted telemetry leaves explicit unattributed/open state and never fabricates hidden-model timing."

  - id: AC-4
    requirement: "Instrumentation overhead is proportional to semantic boundaries."
    evidence_required: "Executor contract/tests or fixtures demonstrate phase/activity transitions occur at semantic boundaries and one long external wait is represented as one interval rather than per-poll/per-tool telemetry."

  - id: AC-5
    requirement: "Existing continuity and retry safety are unchanged."
    evidence_required: "Execution-attempt legacy/current records, slices, checkpoints, lease classification, keyed recovery, OUTCOME_UNKNOWN and no-blind-retry regressions remain green; performance data cannot change retry_is_legal or observer lifecycle classification."

  - id: AC-6
    requirement: "Canonical operational timing semantics remain compatible."
    evidence_required: "Executor/Architect/Task Protocol checks prove canonical operational_timing is still optional, boundary-captured, two-timestamp, non-authoritative, and no elapsed duration is serialized into canonical report/review timing."

  - id: AC-7
    requirement: "No new observability infrastructure or cross-repository coupling is introduced."
    evidence_required: "Diff/tree proof shows no new daemon/database/service/dependency, no Runtime mutation, and documents/, standards/, authority.lock.json, external capability identities, and bootstrap routing remain unchanged."

  - id: AC-8
    requirement: "Foundation verification is green on one coherent final candidate."
    evidence_required: "Focused execution-attempt/performance tests, validator regressions if touched, bootstrap validation/tests, skill-library validation/regression, Python compilation for modified scripts, and git diff --check all PASS."

