structure_authority:
  status: RESOLVED
  source: "existing Execution Attempt local Git-metadata telemetry"
  rationale: "Performance attribution is operational telemetry for execution continuity and belongs in the existing L1 execution-attempt store. It must not create a second telemetry database, daemon, service, collector, workflow engine, or authority source."

objective: "Add a bounded opt-in performance-attribution mode to Foundation Execution Attempt telemetry so an explicitly requested performance audit can distinguish task phase wall time, controller-owned execution time, external-wait time, and unattributed time without pretending to measure hidden model thinking. Preserve default hot-path behavior, authority NONE, privacy, existing operational_timing semantics, current task/review authority, and all execution correctness gates."

scope:
  required_changes:
    - "Evolve Execution Attempt compatibly so performance attribution is opt-in only. Ordinary attempts that are not explicitly performance-audited must not require phase markers, extra tool calls, report fields, or a backend service."
    - "Reuse the existing repository-local Git metadata store. Do not create a second persistence location, tracked telemetry file, database, queue, daemon, background heartbeat, scheduler, collector, dashboard, or Runtime dependency."
    - "Define a fixed performance phase vocabulary sufficient for current Foundation execution: PREFLIGHT, IMPLEMENTATION, VERIFICATION, REPORTING, and PUBLICATION. Architect REVIEW remains separately measured by the existing review operational_timing boundary and is not folded into the Executor attempt."
    - "Define exactly two activity classes: CONTROLLER_OWNED and EXTERNAL_WAIT. CONTROLLER_OWNED means wall time during which control remains with the Executor/controller, including reasoning and synchronous work; it MUST NOT be named or interpreted as model-active or thinking time. EXTERNAL_WAIT means an explicitly marked interval waiting for a long-running process, remote consequence, or other external dependency."
    - "Record only trustworthy current UTC boundary timestamps captured by the helper at transition time. Never reconstruct performance timing from Git commit timestamps, chat timestamps, tool-history timestamps, lease expiry, or report prose."
    - "Allow at most one open performance segment and a bounded completed segment history. The implementation must use a small fixed maximum no greater than 32 completed segments per attempt."
    - "Each stored segment may contain only fixed phase, fixed activity class, started_at_utc, and ended_at_utc. Do not store arbitrary labels, prompts, tool names, argv, paths, commands, model identifiers, token counts, user text, raw logs, tool output, secrets, repository content, or high-cardinality identifiers inside segment telemetry."
    - "Provide deterministic local operations to start/transition/stop performance segments and a read-only summary operation. A transition closes the previous segment and opens the next at one captured boundary so intervals cannot overlap."
    - "The derived summary must report task-attempt wall time, per-phase wall time, CONTROLLER_OWNED time, EXTERNAL_WAIT time, instrumented coverage, and UNATTRIBUTED time. Derived durations may be returned by the helper but must not be persisted as canonical report authority."
    - "UNATTRIBUTED must remain explicit whenever stored segments do not cover the complete attempt window. Missing markers, interruption, malformed telemetry, or incomplete coverage must never be silently assigned to controller or external wait."
    - "Interrupted RUNNING attempts may retain one open performance segment. Inspection may show it as open/incomplete but must not invent an end time beyond trustworthy last-seen/terminal evidence or classify the missing interval as completed work."
    - "Preserve Execution Slice semantics unchanged. Performance segments are observational only and never create mutation, retry, continuation, publication, task, review, acceptance, promotion, or release authority."
    - "Preserve current report/review operational_timing semantics: when explicitly requested, Executor and Architect still capture only the existing trustworthy two RFC3339 UTC boundary timestamps in their canonical artifacts. Do not replace them with derived durations."
    - "Update Executor guidance so performance-audit tasks mark only semantic phase/activity transitions, not every tool call. Long recoverable verification/process waits should use one EXTERNAL_WAIT interval rather than repeated poll markers. The goal is measurement with low observer overhead."
    - "Update Architect guidance so performance audits distinguish Executor processing, external wait, review processing, and queue gap only from trustworthy captured boundaries; no hidden model time, platform scheduler time, or transport internals are inferred without evidence."
    - "Preserve Runtime telemetry as an independent substrate signal. This task does not change agent-runtime, does not require OTLP to be enabled, and does not invent cross-repository trace correlation."
    - "Add deterministic tests for schema compatibility, opt-in behavior, exact transition semantics, bounds, privacy rejection, interruption, unattributed coverage, derived summaries, and authority NONE."
    - "Keep documents/, standards/, profile operator routing, external capability catalog, authority.lock.json, and agent-runtime byte-unchanged."
    - "Publish TASK-0012 implementation and report by non-force fast-forward on main only."

  allowed_existing_files_or_components:
