invariants:
  - "Foundation remains MAIN_ONLY and all canonical Foundation-internal paths resolve from one exact authority_set_identity revision."
  - "There remain exactly two organizational roles: Architect and Executor."
  - "Execution-attempt state has authority NONE and never changes task/review/acceptance/rebinding/release authority."
  - "No execution-attempt record or stale lease may claim exact chat death time. Exact death time is UNKNOWN unless an external authoritative surface explicitly supplies it."
  - "ACTIVE_LEASE means the last-seen lease is still fresh; it is not proof that the chat UI or model process is currently alive."
  - "INTERRUPTED_UNKNOWN means a non-terminal attempt is stale and lacks a terminal marker; it is not equivalent to FAILED or TERMINAL."
  - "TERMINAL_CONFIRMED requires an explicit terminal marker written by the attempt owner/successor under valid current authority."
  - "Execution-attempt local telemetry never substitutes for fresh GitHub canonical truth, fresh repository inspection, or task authority."
  - "The attempt store lives under Git metadata only and must not pollute target worktrees or require .gitignore changes."
  - "No daemon, background heartbeat, scheduler, queue, database, message bus, telemetry service, provider SDK, browser automation, or Agent Runtime mutation is introduced."
  - "TASK-0007 external capability plane, TASK-0008 continuity findings, authority.lock semantics, documents/, standards/, and the exact 15-skill taxonomy remain unchanged except for explicitly authorized navigation/wording."
  - "agent-runtime remains an orthogonal execution substrate and is not modified."

forbidden_changes:
  - "Claim or persist a synthetic exact death timestamp inferred from lease expiry."
  - "Create a heartbeat daemon, LaunchAgent, cron job, scheduled task, background process, server, database, queue, or remote liveness service."
  - "Require hidden ChatGPT session identifiers or provider-private APIs."
  - "Store execution-attempt state in tracked or untracked worktree paths."
  - "Commit execution-attempt records to GitHub."
  - "Store secrets, tokens, prompt bodies, conversation transcripts, raw logs, file diffs, or broad file listings in attempt records."
  - "Allow stale attempt state to authorize reset, cleanup, mutation, publication, rebinding, task creation, or acceptance."
  - "Modify documents/ or standards/ unless a direct canonical contradiction is found and Architect revises the task."
  - "Modify agent-runtime repository, Runtime installation/configuration/state, TCC, Keychain, System Settings, or host-global configuration."
  - "Create branches, PRs, tags, releases, or staging topology."

