acceptance_criteria:
  - id: AC-1
    requirement: "A canonical Execution Attempt Continuity contract and machine-readable template exist with authority NONE, exact repository/task/base binding, bounded timestamps/lease, checkpoint metadata, and explicit RUNNING/TERMINAL producer states."
    evidence_required: "Exact committed contract/template plus positive/negative validation tests for binding, required fields, closed states, timestamp shape, bounded lease, and forbidden payload fields."
  - id: AC-2
    requirement: "Attempt state is stored only under repository-local Git metadata using git rev-parse --git-path and creates no tracked or untracked worktree artifact."
    evidence_required: "Focused tests in temporary Git repositories proving the resolved path, containment, worktree cleanliness, and no .gitignore mutation."
  - id: AC-3
    requirement: "Observer classification is truth-preserving: TERMINAL_CONFIRMED requires an explicit terminal marker; ACTIVE_LEASE is only a fresh last-seen lease; stale non-terminal attempts classify only as INTERRUPTED_UNKNOWN with no exact death timestamp."
    evidence_required: "Deterministic clock-controlled tests across fresh, boundary, stale, and terminal cases, including negative assertions for DEAD/FAILED/death_at inference."
  - id: AC-4
    requirement: "Start, heartbeat, checkpoint, terminal, inspect, and current-task listing are deterministic, bounded, stdlib-only, and preserve terminal idempotency."
    evidence_required: "Focused CLI/library tests proving allowed transitions, repeated terminal behavior, attempt isolation, malformed/path-traversal failures, and bounded output."
  - id: AC-5
    requirement: "Checkpoint metadata is sufficient to guide recovery but explicitly non-authoritative; recovery still requires fresh HEAD/remote/worktree inspection before cleanup, continuation, or publication."
    evidence_required: "Contract/role/protocol semantics plus tests/static assertions that inspect output carries authority NONE and cannot assert canonical Git truth or authorize consequence."
  - id: AC-6
    requirement: "Long-running Executor guidance creates/refreshes attempt state at bounded lifecycle checkpoints and marks terminal state when a terminal result is reached, without requiring a background heartbeat."
    evidence_required: "Minimal Architect/Executor/Task Protocol/Foundation Architecture diff mapping the new L1 owner and preserving all existing L0 authority."
  - id: AC-7
    requirement: "Bootstrap exposes only canonical Foundation-relative execution-continuity contract/tool locators at the active authority_set_identity revision; local attempt data itself is never bootstrap authority or remote state."
    evidence_required: "Bootstrap local/remote and fail-closed locator tests."
  - id: AC-8
    requirement: "The design conforms to existing documents/standards ownership and evidence semantics without mutating documents/ or standards/: missing/stale liveness evidence remains UNKNOWN; material failure state is attributable; retry/recovery remains bounded."
    evidence_required: "Exact unchanged blob proof for documents/ and standards/ plus traceability notes/tests to DOCUMENT_MODEL, STANDARD_MODEL, OBS, REL, and ASR semantics."
  - id: AC-9
    requirement: "TASK-0007 external capability plane, TASK-0008 continuity findings, authority.lock, agent-runtime, and exact 15-skill taxonomy remain unchanged."
    evidence_required: "Exact diff/blob proof and skill-library validation."
  - id: AC-10
    requirement: "All existing Foundation bootstrap, protocol, skill-library, and regression validation remains green."
    evidence_required: "All required repository-native verification commands PASS on the final candidate."

