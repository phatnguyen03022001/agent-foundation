structure_authority:
  status: RESOLVED
  source: "accepted three-layer Foundation architecture plus current documents/standards ownership"
  rationale: "Execution-attempt liveness is L1 local operational continuity. It must not become L0 authority, project-document truth, a fourth layer, or an Agent Runtime service requirement."

objective: "Add a minimal local-only execution-attempt continuity contract and tool so an Architect or successor Executor can distinguish confirmed terminal attempts from fresh leases and stale non-terminal attempts, recover the last known checkpoint, and classify stale attempts as INTERRUPTED_UNKNOWN without inventing an exact death timestamp, heartbeat daemon, provider-specific session API, or new authority."

scope:
  required_changes:
    - "Create one canonical Execution Attempt Continuity contract defining a local operational attempt record with authority NONE and an opaque attempt_id bound to exact repository, task id/revision, and exact execution base."
    - "Store execution-attempt state only in repository-local Git metadata resolved with git rev-parse --git-path under an agent-foundation/execution-attempts namespace. The tool must not create tracked/untracked worktree files merely to record liveness."
    - "Define producer states RUNNING and TERMINAL. Define observer classifications TERMINAL_CONFIRMED, ACTIVE_LEASE, and INTERRUPTED_UNKNOWN. A non-terminal stale lease may only become INTERRUPTED_UNKNOWN; it must never manufacture DEAD, FAILED, TERMINAL, or an exact death timestamp."
    - "Record started_at_utc, last_seen_at_utc, lease_seconds, last checkpoint kind, and bounded checkpoint Git identities/state sufficient to guide recovery. Local timestamps are operational telemetry only and never authority or canonical remote truth."
    - "Provide deterministic stdlib-only start, heartbeat, checkpoint, terminal, inspect, and list-current-task operations. Start creates one attempt record; heartbeat only refreshes last_seen_at_utc; checkpoint refreshes last_seen plus bounded Git checkpoint metadata; terminal writes one explicit terminal result and terminal_at_utc."
    - "Use a bounded lease with a documented default. The Executor must be able to refresh heartbeat/checkpoint explicitly during long work; no background process, daemon, scheduler, automation, or periodic service is introduced."
    - "Inspect must classify from the record plus current time without mutating it. When a RUNNING attempt exceeds its lease, return INTERRUPTED_UNKNOWN together with last_seen_at_utc and the last checkpoint; do not infer when the chat actually died."
    - "Recovery semantics must require fresh repository inspection after INTERRUPTED_UNKNOWN. Attempt telemetry may guide checkpoint recovery but cannot substitute for fresh HEAD/remote/worktree evidence or authorize reset/cleanup/publication."
    - "Terminal marking must be explicit and idempotent for the same terminal result. A successor must not rewrite a confirmed terminal attempt back to RUNNING."
    - "Attempt records must exclude secrets, tokens, full prompts/conversation history, raw tool logs, diffs, report bodies, and broad file inventories."
    - "Expose one canonical Foundation-relative bootstrap/navigation locator for the execution-continuity contract/tool. The local attempt-state directory itself remains local Git metadata and is never a bootstrap authority artifact."
    - "Update Architect, Executor, Task Protocol, and Foundation Architecture only where needed so long-running Executor workflows create/refresh/terminalize attempt state at bounded execution boundaries and recovery sessions inspect it before discarding local work."
    - "Add focused tests for exact binding, state transitions, lease classification, stale UNKNOWN behavior, terminal idempotency, local Git-metadata containment, no worktree pollution, path traversal rejection, no secret/log payload fields, and recovery-not-authority semantics."
    - "Consult documents/ and standards/ as normative semantic/evidence constraints and keep them unchanged unless a directly contradictory canonical rule is discovered. Any required documents/standards mutation is architecture/spec expansion and must stop for Architect revision."
    - "Publish TASK-0009 implementation and report by non-force fast-forward on main only."

  allowed_existing_files_or_components:
    - "profile/.agent/bootstrap/bootstrap.json"
    - "profile/.agent/bootstrap/validate.py"
    - "profile/.agent/bootstrap/test_bootstrap.py"
    - "skills/contracts/FOUNDATION_ARCHITECTURE.md"
