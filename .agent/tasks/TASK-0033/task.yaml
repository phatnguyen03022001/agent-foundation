    - "Fresh-resolve the exact handoff/task and TASK-0032 ACCEPTED review; safely FF-only synchronize the designated local mirror when behind. Allow precisely the pinned .DS_Store exception; divergence, unrelated edits, conflicts or Git-operation state stop without adoption, reset, cleanup or publication."
    - "Use the existing Recovery section of EXECUTION_CONTINUITY.md for the minimal interrupted-chat procedure. A fresh chat re-resolves exact repository/task/revision/original execution base and current authority, then only material target owners, prior checkpoint/candidate/verifier identities and any retained keyed operation needed for the next consequence. Conversation memory, elapsed time, a lease and a locator grant no authority or PASS. Preserve the original base as lineage evidence; never reset/rebase/rebind just to make a resumed state resemble initial entry."
    - "Clarify the L0 initial-entry versus interrupted-work distinction only in Task Protocol's existing Canonical handoffs and compact prompt locators and Execution base without self-reference sections; its execution-attempt section may receive only a short Recovery owner cross-reference. Initial entry still proves live HEAD equals the exact handoff base. Continuing an unfinished exact task requires current task/user authority covering the resumed state and operations, fresh attributable local/remote/operation evidence, and one authorized writer; interruption alone creates no dirty/ahead adoption exception. Respect explicit clean-state, restrictive file, topology, candidate-parent and other task rules. If these predicates cannot be proved or current authority does not cover recovery, preserve state and return the actual blocker for revised recovery authority. Do not silently substitute a checkpoint as a new handoff base."
    - "The Recovery owner must make these consequences explicit without copying existing slice/carrier tables: (a) resolve retained process identity/typed effect first and independently reconcile external effects not proven by it; (b) proof of an existing effect avoids duplicate dispatch/commit/push; absent effect permits retry only with original preconditions and existing authority, while unknown remains unresolved; (c) an expired lease is not evidence that the former writer cannot still act; missing writer ownership or unresolved work attribution stops competing mutation; (d) terminal NEEDS_REVIEW/report lineage stops Executor recovery, and review/verification/promotion/release use their own existing authority. No automatic successor dispatch, self-review, task creation or new lifecycle."
    - "For controllable boundaries, describe a minimum non-authoritative handoff/locator in the existing Recovery owner: exact task/original-base authority locator, current checkpoint/candidate identity, retained operation identity when needed, exact relevant proof locator, unresolved effect/gap and next intended consequence. Derive what is resolvable from existing artifacts rather than copying transcript, scope, full Foundation, outputs or target content. It need not be a tracked file, formal schema or mandatory telemetry call; use existing carriers/attempt/checkpoints only where needed. Unexpected chat death may leave no handoff; fresh inspection remains sufficient only when the same required predicates can still be proved. Missing evidence is not filled from memory."
    - "Apply existing exact-predicate proof applicability: after re-resolving immutable identities, reuse completed verification only when its candidate/content, predicate, selected verifier/profile and material inputs/toolchain still match. Poll a recoverable in-flight operation rather than restart it merely because the chat changed. A missing/truncated/expired result may require safe read-only re-verification; material invalidation reruns only affected required proof. Do not claim reuse from a digest without resolvable evidence, blanket replay of a mutation, or universal full-suite rerun per chat. Current phase capability is refreshed where material. Detailed debugging/testing HOW stays target/ECC-owned."
    - "Add a concise skills README locator at its existing Execution Continuity entry. Net UTF-8 addition across the three allowed existing files <=3000 bytes. Prefer short owner references; already sufficient rules are reused unchanged. Kernels stay byte-identical at Architect 16656 / Executor 17359. No new generic methodology, time/tool-call/token budget, schema/template/helper implementation, persistent recovery state or operational timing is introduced. If a required coherent fix actually needs a forbidden owner/schema/runtime change, report that concrete BLOCKING gap rather than invent permission."
    - "Persist four bounded synthetic recovery walkthroughs: (1) interrupted long verification with retained keyed identity resolves the original result, and immutable completed proof is reused only after exact applicability checks; (2) same-task partial dirty work or a local candidate checkpoint is freshly attributed, with explicit current recovery authority versus its absence and an overlapping/unknown former writer; neither telemetry nor known scope admits unknown work; (3) lost commit/publication acknowledgement reconciles effect-present, effect-absent with unchanged preconditions, unresolved effect and stale remote alternatives separately; (4) published report/NEEDS_REVIEW closes Executor authority, while expired/missing verifier evidence selects safe affected re-verification and missing mandatory carrier/capability stays capability-blocked. Each names exact relevant authority excerpts, current observable inputs, required freshness, disposition and next permitted action/stop. Include a compact locator example without creating another artifact/schema. These are conditional examples, not actual Runtime interruption or product recovery certification."
    - "Run native skills validator, existing skills 240/240, external 26/26 and execution-attempt 33/33 regressions, current task/report artifact validators, new links/anchors, exact section-edit scope, three-file inventory/kernel/protected-state checks and git diff --check. The existing attempt tests exercise unknown intent/result/reconciliation, carrier selection and checkpoint semantics in disposable fixtures; no new prose-mirroring tests or actual target attempt/Runtime mutation. Report precise commands/results and reconstructible material walkthrough inputs. Documents/Standards inputs stay unchanged; no unrelated rerun absent new material invalidation."
    - "Commit the qualified authorized-file candidate as direct child of the exact handoff base, then its sole report-only child; apply existing publication eligibility and truthful candidate-prepublication pushed=false. Publish ordinary non-force MAIN_ONLY and fresh-prove local main == origin/main == remote main at the report commit, one worktree, tracked/index clean and pinned .DS_Store. End NEEDS_REVIEW and stop before independent review, real dogfood/adversarial product execution or successor work."
