  status: RESOLVED
  source: "inspected existing continuity, handoff/base, evidence, role and publication owners at exact reviewed report"
  rationale: "Existing primitives already recover keyed operations and forbid blind retry. Add only the missing bounded use boundary for resuming an unfinished exact task across chat interruption, with compact locators and attributable partial-state/proof checks. Keep established rules at their owners; no new mode, field, engine, recovery document or provider admission."
