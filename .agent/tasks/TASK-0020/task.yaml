structure_authority:
  status: RESOLVED
  source: "AGENT_FOUNDATION_PLAN.md sections 15-18, 32-35 and 45-47, constrained by accepted T1/T2 state ownership"
  rationale: "T3 evolves the existing target-specific product-state object and human contract in place. It must not create a second feature-state file or independent state authority. derived_state is a validated projection of explicit gate/evidence facts, not an independently authored source of truth."

objective: "Establish agent-foundation's T3 feature lifecycle, explicit feature gates, inspectable evidence references, and deterministic evidence-derived feature state for all four current product-scope features. Evolve product-state.json from schema version 1 to schema version 2 while preserving T2 product/release scope semantics. Prevent dual SSOT by requiring the validator to recompute each derived_state from gate statuses and reject any mismatch. Use conservative evidence: missing, contradictory, stale, inaccessible, or not-attributable evidence yields UNKNOWN/not-PASS and cannot promote state. Do not create global system gates, project phase/progression, Architect planning integration, execution/UI recovery redesign, or adoption closure."

scope:
  required_changes:
    - "Evolve product-state.json schema_version from 1 to 2 in place; do not create feature-state.json or another lifecycle-state artifact."
    - "Preserve T2 target identity, product_scope revision 1/FROZEN, exact F001-F004 identities/names/owners, and release OPEN with null/UNKNOWN release identity and required feature set."
    - "Extend each registered F001-F004 feature with one lifecycle object containing exactly: gates, derived_state, and regression."
    - "Define exactly seven target lifecycle gates in order: scope, specification, implementation, integration, verification, release_readiness, production_acceptance."
    - "Each gate must record status from PASS | FAIL | PENDING | N/A | UNKNOWN, evidence_refs as a bounded array of inspectable canonical repository-relative references, and reason as null or a non-empty string according to status semantics."
    - "PASS requires at least one inspectable evidence_ref and may not rely on memory, chat claims, task status alone, filename alone, code presence alone for VERIFIED, or a future/nonexistent artifact."
    - "FAIL requires attributable evidence_refs plus a non-empty reason. PENDING and UNKNOWN require a non-empty reason. N/A requires a non-empty justification/reason and never counts as PASS for lifecycle advancement."
    - "Every evidence_ref must resolve to current canonical repository evidence or an immutable in-repository historical artifact whose concrete evidence remains attributable to the current feature bytes. Historical task/report/review state alone is insufficient."
    - "Do not cite TASK-0020's future report.yaml or review.yaml from the implementation candidate. A future artifact cannot be evidence for the candidate that precedes it."
    - "If TASK-0020 modifies bytes owned by a feature and no already-persisted evidence independently covers those exact final feature bytes, that feature's verification gate must remain UNKNOWN/not-PASS. Fresh Executor test runs qualify TASK-0020 but do not circularly manufacture pre-report product-state evidence."
    - "Require scope gate PASS for all four frozen registered features; T2 registry plus target-owned scope/boundary evidence must make PLANNED mechanically reachable."
    - "Define deterministic derived-state computation: scope PASS establishes PLANNED; specification PASS advances to SPEC_READY; implementation PASS with integration not PASS advances to IMPLEMENTING; integration PASS advances to INTEGRATED; verification PASS advances to VERIFIED; release_readiness PASS advances to RELEASE_READY; production_acceptance PASS advances to LIVE. The first ordered gate that is not PASS prevents advancement beyond the corresponding prior state."
    - "Reject later-gate PASS when any earlier prerequisite gate is not PASS."
    - "While release.status is OPEN or release identity/required feature set remains unresolved, release_readiness and production_acceptance must remain UNKNOWN/not-PASS for every feature. Therefore current T3 state cannot exceed VERIFIED."
    - "Freshly audit F001-F004 against current target-owned evidence. Derive each current state conservatively; do not predeclare all features VERIFIED. Missing evidence remains UNKNOWN and lowers the derived state as required."
    - "For specification evidence, require enough current target-owned material to make the capability implementable without material architecture guessing, adapted to agent-foundation rather than forcing web/frontend/backend concepts."
    - "For implementation evidence, require at least one real current production/repository artifact of the capability, not a task claim."
    - "For integration evidence, require the feature's complete applicable repository-native slice to be connected through its explicit contracts. Inapplicable generic fullstack layers do not need fake N/A entries because T3 uses target-specific lifecycle gates."
    - "For verification evidence, require persisted inspectable evidence attributable to the exact current integrated feature bytes; a test definition without a result is not itself verification PASS."
    - "Extend AGENT_FOUNDATION_PRODUCT_STATE.md in place as the single human-readable T2+T3 product-state contract. Preserve T2 semantics and document evidence/gate/derivation/regression rules without creating a second contract."
    - "Implement deterministic validation that recomputes derived_state from gate statuses and rejects user-authored disagreement, invalid status/evidence/reason combinations, prerequisite violations, release-readiness promotion while release is unresolved, unresolved/missing evidence references, and lifecycle fields outside the exact schema."
    - "Define forward-only transition semantics. Add a bounded deterministic transition-check helper or equivalent validator logic that rejects a lower derived_state than a prior valid schema-2 state unless current lifecycle.regression records from_state, to_state, non-empty reason, and inspectable evidence_refs matching the downgrade. Initial schema-1 to schema-2 adoption uses regression null."
    - "Do not turn regression into a history log; store only the current explicit regression record when one is required."
    - "Add focused regressions for all seven lifecycle states/thresholds, UNKNOWN-not-PASS, N/A justification/non-advancement, PASS evidence requirement, prerequisite ordering, derived_state mismatch rejection, release OPEN cap at VERIFIED, future-artifact/self-attestation rejection, stale/nonexistent evidence rejection, and backward-transition regression requirements."
    - "Freshly run owner-native verification surfaces as TASK-0020 qualification evidence: profile bootstrap validation/regressions; skills validator/regressions and external sync/regressions; documents validator test suite; standards repository verifier. These runs do not automatically promote feature verification state unless durable pre-candidate evidence rules above are independently satisfied."
    - "Keep TASK-0014 through TASK-0019 historical artifacts unchanged. Keep T1 architecture contract, seven-skill taxonomy, rationalization, ECC/external metadata, documents/, standards/, authority.lock.json, agent-runtime, Runtime/host state, credentials, branches, tags, and releases unchanged."
    - "Publish implementation/report on main only by ordinary non-force fast-forward."

  allowed_existing_files_or_components:
    - "product-state.json"
    - "skills/contracts/AGENT_FOUNDATION_PRODUCT_STATE.md"
