    - "skills/scripts/test_validate_skill_library.py"
    - ".agent/tasks/TASK-0020/**"

  expected_files_are_restrictive: false

invariants:
  - "agent-foundation remains the target-owned product-state authority."
  - "There is one machine-readable product-state SSOT: product-state.json. No parallel feature-state store is introduced."
  - "derived_state is a projection validated from gates/evidence, never an independent authoritative input."
  - "T2 product scope/release scope semantics remain intact."
  - "Exactly four current features F001-F004 remain registered under product_scope revision 1."
  - "UNKNOWN, PENDING, FAIL, and N/A are never equivalent to PASS for lifecycle advancement."
  - "Task acceptance, report/review state, UI/chat state, and Runtime execution state never manufacture feature state."
  - "Historical artifacts count only through concrete still-attributable evidence, not lifecycle labels."
  - "Release OPEN/unresolved prevents RELEASE_READY or LIVE."
  - "No global system gates, project phase, aggregate release state, earliest blocker, progression planner, scheduler, daemon, workflow engine, or central multi-repository state service is introduced."
  - "T1 architecture contract and protected domains remain unchanged."
  - "One initiating chat/session is not required to reconstruct feature gates or derived state."

forbidden_changes:
  - "Create feature-state.json, a second product-state manifest, or T4-T6 task artifacts."
  - "Store an authored state that validator does not recompute."
  - "Promote a feature from task/report/review terminal status alone."
  - "Treat a test source file or verifier definition alone as evidence that verification passed."
  - "Cite TASK-0020 report/review before those artifacts canonically exist."
  - "Turn fresh Executor terminal output into a hidden product-state PASS without persisted inspectable evidence."
  - "Force generic frontend/backend/data/async gates onto agent-foundation capabilities when those layers are not target-applicable."
  - "Mark N/A as equivalent to PASS."
  - "Set release_readiness or production_acceptance PASS while release scope remains OPEN/unresolved."
  - "Implement global gates, project phase, progress metrics, earliest-blocker selection, Architect progression changes, execution/UI recovery changes, or closure."
  - "Modify T1 architecture, seven-skill taxonomy, rationalization, external pins/metadata, documents/, standards/, authority.lock.json, agent-runtime, Runtime/tunnel state, credentials, host security, branches, tags, releases, or repository metadata."

