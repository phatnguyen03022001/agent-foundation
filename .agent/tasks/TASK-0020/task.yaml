acceptance_criteria:
  - id: AC-1
    requirement: "product-state.json schema 2 is the sole machine-readable feature lifecycle owner and preserves accepted T2 scope/release truth."
    evidence_required: "Exact schema/object proof shows unchanged F001-F004 registry and OPEN unresolved release plus one lifecycle object per feature; no second state file/owner exists."

  - id: AC-2
    requirement: "Feature state is mechanically derived from explicit ordered gates rather than authored independently."
    evidence_required: "Validator and focused tests recompute derived_state, reject mismatches and later-gate PASS without prerequisites, and prove all seven lifecycle thresholds."

  - id: AC-3
    requirement: "Gate truth is evidence-backed and fail-closed."
    evidence_required: "PASS requires inspectable evidence; FAIL/PENDING/UNKNOWN/N/A semantics are validated; missing/stale/nonexistent/future/self-referential evidence cannot manufacture PASS; UNKNOWN/N/A never advance state."

  - id: AC-4
    requirement: "Current F001-F004 states are freshly and conservatively derived from target-owned evidence."
    evidence_required: "Per-feature gate matrix cites current inspectable evidence; independent review can reconstruct why every PASS is attributable and why every non-PASS blocks advancement. No state is inferred from task acceptance or conversation."

  - id: AC-5
    requirement: "Release uncertainty caps current lifecycle correctly."
    evidence_required: "With release OPEN/id UNKNOWN/required features UNKNOWN, every feature has release_readiness and production_acceptance not-PASS and no derived state exceeds VERIFIED."

  - id: AC-6
    requirement: "Forward-only semantics and explicit evidence-backed regression are deterministic."
    evidence_required: "Transition tests reject downgrade without a matching regression record and accept only an exact from/to/reason/evidence regression; initial schema-1 migration records no fabricated regression."

  - id: AC-7
    requirement: "T3 remains bounded and protected T1/T2/Foundation/external owners are preserved."
    evidence_required: "Base-to-candidate diff is limited to product-state.json, the existing product-state contract, validator, tests; no T4-T6/global-phase/progression/recovery machinery; protected object identities remain unchanged."

  - id: AC-8
    requirement: "All target and owner-native qualification checks are green on one coherent final candidate."
    evidence_required: "Task validation, focused T3 tests, full skill/protocol validator/regressions, external sync/regressions, profile bootstrap local/remote/regressions, documents validation regressions, standards tools/verify.py, JSON parse, Python compile, internal links when affected, protected-path checks, and git diff --check PASS."

