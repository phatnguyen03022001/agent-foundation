structure_authority:
  status: RESOLVED
  source: "TASK-0020 revision-1 Architect review"
  rationale: "Revision 1 established the intended T3 schema and current conservative state but failed independent red-team review because historical verification evidence was recognized by broad token co-occurrence. Revision 2 is a narrow proof-contract correction, not a T3 redesign."

objective: "Correct TASK-0020's historical verification-evidence recognition so a verification gate can PASS only from an owner-specific positive persisted result attributable to the exact current owner bytes. Preserve the revision-1 T3 schema, derivation, release cap, prerequisite, regression, and current feature-state semantics unless the corrected parser itself proves that a current PASS is unsupported. Close the two exact red-team exploits reproduced by Architect without expanding into T4-T6."

scope:
  required_changes:
    - "Freshly reconcile local HEAD, origin/main, remote main, ahead/behind, and clean worktree against the exact revision-2 execution base before mutation."
    - "Treat revision-1 review defect reproduction as mandatory red tests: (1) profile evidence containing OPM_BOOTSTRAP = FALSE plus result: FAIL must not qualify as verification PASS; (2) documents_tests result FAIL plus an unrelated result PASS elsewhere must not qualify as documents verification PASS."
    - "Replace broad token-co-occurrence logic in _verification_report_covers_owner with deterministic owner-specific positive-result recognition."
    - "Preserve exact current-owner-tree attribution: historical verification evidence remains valid only when the report's final_execution_head exists and the current owning subtree is byte-equivalent to that evidenced candidate."
    - "For profile/, require an explicit positive bootstrap verification signal attributable to profile bootstrap, including exact TRUE semantics; mere presence of the OPM_BOOTSTRAP token, FALSE, UNKNOWN, FAIL, or contradictory/ambiguous bootstrap evidence must not pass."
    - "For documents/ and standards/, when the report exposes owner-specific result blocks such as documents_tests or standards_verifier, bind PASS/FAIL/CAPABILITY_BLOCKED to that exact block. A PASS elsewhere in the report must not satisfy the owner-specific gate."
    - "For skills/, require an owner-specific persisted positive verification signal; a generic PASS token or unrelated check must never qualify. Keep this conservative if no canonical historical PASS shape exists."
    - "Reject contradictory owner-specific evidence within one report. Ambiguous positive/negative evidence is not PASS."
    - "Do not weaken path existence, future/self-attestation rejection, exact owner-byte attribution, ordered gate derivation, release OPEN cap, UNKNOWN/N/A semantics, or transition regression checks."
    - "Add adversarial regressions for the two exact Architect reproductions and for owner-specific contradictory/mis-scoped PASS cases across supported owners where practical."
    - "Prove the real current F001 and F003 verification refs still qualify only through correctly scoped positive evidence. Prove F004 TASK-0004 standards_verifier CAPABILITY_BLOCKED remains not-PASS. F002 remains not-PASS unless independently persisted exact-final-byte evidence already exists."
    - "Preserve product-state.json byte-for-byte if corrected parsing yields the same F001=VERIFIED, F002=INTEGRATED, F003=VERIFIED, F004=INTEGRATED projection. If and only if the corrected parser proves an existing verification PASS unsupported, update product-state.json conservatively and update the existing product-state contract only as required to keep canonical state truthful."
    - "Do not use TASK-0020 revision-2 report/review or fresh terminal output to manufacture product verification PASS."
    - "Rerun focused T2+T3 tests, including the new exploit regressions, then the full repo-native qualification set required by revision 1."
    - "Keep T1 architecture, T2 scope/release semantics, seven-skill bodies, rationalization/external metadata, documents/, standards/, authority.lock.json, TASK-0014..0019, agent-runtime, Runtime/host state, credentials, branches, tags, and releases unchanged."
    - "On successful qualification create .agent/tasks/TASK-0020/report-r2.yaml with result NEEDS_REVIEW, commit it as the sole report-only child of the revision-2 implementation candidate, and publish by ordinary non-force fast-forward."
    - "If corrected evidence parsing changes canonical feature state, report the exact state delta and evidence basis; do not preserve revision-1 state merely for continuity."

  allowed_existing_files_or_components:
    - "skills/scripts/validate_skill_library.py"
    - "skills/scripts/test_validate_skill_library.py"
    - "product-state.json only if corrected parser changes canonical derived truth"
    - "skills/contracts/AGENT_FOUNDATION_PRODUCT_STATE.md only if a product-state truth change requires corresponding documentation"
    - ".agent/tasks/TASK-0020/task.yaml"
    - ".agent/tasks/TASK-0020/report.yaml"
    - ".agent/tasks/TASK-0020/review.yaml"
    - ".agent/tasks/TASK-0020/report-r2.yaml"

  expected_files_are_restrictive: true

invariants:
  - "Revision 2 repairs evidence recognition only; it does not redesign the T3 lifecycle model."
  - "product-state.json remains the sole machine-readable product-state SSOT."
  - "derived_state remains validator-recomputed from ordered gates."
  - "Historical verification PASS requires both owner-specific positive persisted result evidence and exact current owner-tree attribution."
  - "Negative, blocked, unknown, contradictory, or unrelated PASS evidence never qualifies an owner verification gate."
  - "Task/report/review lifecycle status alone never manufactures product state."
  - "Release remains OPEN/null/UNKNOWN and therefore no feature exceeds VERIFIED."
  - "No global gates, project phase, earliest blocker, Architect progression integration, execution/UI recovery redesign, T4-T6 artifact, scheduler, daemon, queue, workflow engine, or central state service is introduced."
  - "No host dependency installation or environment mutation is authorized."

forbidden_changes:
  - "Accept broad global PASS token matching as owner-specific evidence."
  - "Treat OPM_BOOTSTRAP = FALSE as positive profile verification."
  - "Treat documents_tests FAIL or standards_verifier CAPABILITY_BLOCKED as PASS because another report block contains PASS."
  - "Remove exact owner-tree attribution or weaken future/self-attestation evidence guards."
  - "Promote F002 from TASK-0020 revision-2 test output or report/review state."
  - "Change product-state.json merely to simplify tests; state changes require corrected parser evidence."
  - "Create another state manifest, another lifecycle authority, T4-T6 tasks, or global/project progression machinery."
  - "Modify protected owners, ECC/external pins, documents/, standards/, authority.lock.json, agent-runtime, Runtime/host/dependency state, credentials, branches, tags, releases, or repository metadata."

