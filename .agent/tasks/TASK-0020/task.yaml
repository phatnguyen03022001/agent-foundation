acceptance_criteria:
  - id: AC-1
    requirement: "The two exact revision-1 Architect evidence-spoof exploits are closed."
    evidence_required: "Fresh focused regressions prove OPM_BOOTSTRAP=FALSE/result FAIL is rejected for profile and documents_tests FAIL plus unrelated PASS is rejected for documents."

  - id: AC-2
    requirement: "Historical verification evidence is owner-specific, positive, and exact-byte attributable."
    evidence_required: "Parser tests prove intended owner result is structurally/semantically bound, contradictory or ambiguous owner evidence fails closed, and owner-tree equivalence to final_execution_head remains required."

  - id: AC-3
    requirement: "Current canonical F001-F004 verification/state projection is requalified through corrected evidence parsing."
    evidence_required: "Real canonical refs are reevaluated. F001/F003 may remain VERIFIED only if corrected parser proves scoped positive evidence; F004 blocked evidence remains not-PASS; F002 remains not-PASS absent persisted exact-final-byte evidence."

  - id: AC-4
    requirement: "Revision-1 T3 semantics outside the parser defect remain intact."
    evidence_required: "Focused regressions continue proving derived-state recomputation, ordered prerequisites, UNKNOWN/N/A non-advancement, release OPEN cap, future/self evidence rejection, and forward-only regression semantics."

  - id: AC-5
    requirement: "Revision 2 is narrowly scoped."
    evidence_required: "Base-to-candidate diff modifies only validator/tests, plus product-state/contract only if corrected truth requires it; no T4-T6/progression/recovery machinery or protected-owner changes."

  - id: AC-6
    requirement: "All owner-native and repository qualification is green on one coherent final candidate."
    evidence_required: "Focused T2+T3+rev2 regressions, full skills/protocol tests, external sync/regressions, profile local/remote/regressions, documents regressions, standards verifier using an already-available qualified interpreter, JSON parse, Python compile, protected-path checks, git diff --check all PASS."

