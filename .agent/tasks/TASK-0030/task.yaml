    - "Add one bounded procedure at the external-plane README with a concise skills README locator: resolve target owners and need; locate and inspect minimum exact-pinned relevant common/language/framework rule sections; evaluate compatibility and material conflicts; obtain missing material decisions through Architect; persist only approved target-specific rule meaning/reference in the existing target owner through separately authorized target mutation; load it on demand under that target scope. If scoped adoption is absent or not provable, keep upstream HOW advisory. Missing relevant source or contradictory material target truth fails explicitly; never fabricate a catalog skill ID for unindexed rules. Task-0029 CLI query/resolve remains skill/command/agent metadata navigation and does not discover or adopt rules by implication."
    - "Preserve the existing no-activation statements while clarifying intentional scoped target adoption. Rule selection or copying never installs/activates upstream hooks, role/model/session/memory systems, installers, global configuration or implicit relative include trees. Resolve materially relevant referenced source sections at the same immutable pin; translate or preserve their relationships without broken local references or unnoticed inherited obligations. A local path alone is not approval. Upstream updates never silently change the adopted target rule; material target/source changes require applicable target re-evaluation and separately authorized edits, not automatic synchronization."
    - "Persist three compact synthetic walkthrough receipts in the task report only: (1) a mixed React/TypeScript frontend plus Go backend chooses language-specific guidance within the corresponding declared components and avoids carrying frontend tooling/props rules into Go; (2) a target already using another approved schema-validation mechanism evaluates the TypeScript Zod recommendation without adding a dependency or replacing its native contract; (3) a new-context consumer reconstructs an approved rule from an exact scoped target-owned record, while mere local copy or indexed/loaded upstream content does not prove adoption or mutation authority. Use the actual pinned source sections above, explicit synthetic target constraints, accepted/adapted/rejected conclusions and the evidence missing in each negative case. These are synthetic proof inputs, not actual target adoption or another repository binding."
    - "Keep the three-file documentation change small: total final UTF-8 bytes minus handoff-base total must be <=4000, with no copied generic HOW examples or rule corpus. Foundation Architecture owns only the irreducible authority/ownership/provenance semantics; external-plane README owns navigation/procedure; skills README is a concise locator. Both kernels stay byte-identical. Do not add tests that merely assert new prose: verify meaningful positive/negative synthetic semantics and links, then run the existing related qualification."
