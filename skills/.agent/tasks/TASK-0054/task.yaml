structure_authority:
  status: RESOLVED
  source: "Existing Task Protocol, Architect/Executor role skills, report/review contracts, and doctrine regression surface"
  rationale: "The defect is reusable governance semantics, not a new framework. Correct the existing semantic owners and focused regressions only."

objective: "Make execution and canonical publication policy-compliant by construction while preserving proof quality: route by semantic capability rather than provider identity, prefer explicit bounded/typed consequence actions over opaque generic execution when equivalent, fail closed on platform safety blocks without bypass behavior, permit exact immutable publication handoff when a writer loses only publication capability, and preserve verification/evidence rigor across all fallbacks."

scope:
  required_changes:
    - "Fresh-bind TASK-0054 at its exact canonical base and fresh-resolve current official OpenAI documentation relevant to ChatGPT app/MCP write actions, permission/confirmation behavior, and risky-action blocking. Treat those docs as mutable external evidence; capture only durable vendor-neutral consequences in repository doctrine."
    - "Refine protocols/TASK_PROTOCOL.md so execution routing begins from required semantic capability and current authority, not a provider/tool name. A task MAY materially bind a specific surface only when that surface identity itself is required by the proof or consequence; otherwise provider-specific handoff wording must not accidentally narrow valid authorized routing."
    - "Define consequence-surface preference without claiming typed tools are automatically safe: when multiple authorized surfaces can perform the same consequence with equivalent evidence, prefer the narrowest explicit bounded action whose inputs, target, expected precondition, mutability, force/destructive behavior, and postcondition are machine-checkable over opaque arbitrary command execution. Generic terminal remains a valid fallback/escape hatch when no sufficient typed surface exists and platform policy permits it."
    - "Define platform/tool safety blocking as capability evidence, not a semantic task failure and not permission to bypass. A blocked/refused request MUST NOT be obfuscated, split, encoded, rephrased solely to evade safety evaluation, retried repeatedly without materially changed capability evidence, or used to justify widening permissions/config. Record the required semantic capability as unavailable for that phase and follow normal CURRENT_PHASE_CAPABILITY_UNAVAILABLE/rebind/operator boundaries."
    - "Preserve quality invariant: changing execution surface, requiring confirmation, using a typed action, or falling back to an explicit operator action MUST NOT weaken acceptance criteria, verifier identity, exact commit/content identity, remote freshness, scope checks, or evidence quality. Platform compliance changes HOW a consequence is carried out, not WHAT must be proven."
    - "Refine one-writer semantics around consequence boundaries. Exactly one writer remains authorized for content mutation within an active mutation boundary, but a completed immutable local commit MAY be handed off for publication only after the prior writer is terminal and mutation authority is explicitly transferred. The successor may publish only the exact immutable object/content identity authorized by the handoff and may not edit/recreate/amend it unless a new task/revision grants content mutation authority."
    - "Define immutable publication handoff preconditions: exact repository/branch, exact local candidate identity, exact parent/base, exact tracked delta or content identity as required, clean/no-staged local state when local proof is relevant, fresh canonical remote expected-head proof immediately before publication, non-force consequence unless separately authorized, and fresh remote proof after publication. Remote drift fails closed."
    - "Support typed remote publication that may create a different commit identity only when task authority is explicitly content-identity based rather than exact-commit based. Never silently substitute create-file/create-commit/update-ref semantics for an exact local commit handoff when SHA identity is part of the proof contract."
    - "Clarify operator fallback: human execution is allowed only when current authorized automation cannot safely perform the required consequence or the action is genuinely user-only/approval-bound. The operator becomes an explicit external consequence actor; exact preconditions and post-publication remote proof remain mandatory. Do not default to manual RPC merely because an automated path was blocked once."
    - "Refine Executor report/publication semantics so a report never self-attests its own same-commit publication. If report publication is unavailable, preserve the exact immutable local report commit/checkpoint when safely possible and return a truthful non-durable terminal result; a later publication-only handoff may publish that exact checkpoint under the immutable-handoff rules."
    - "Refine Architect review semantics so typed repository writes are preferred for Architect-owned durable review publication when sufficient and authorized, while exact reviewed-report identity and remote freshness remain unchanged. Review publication capability failure remains CURRENT_PHASE_CAPABILITY_UNAVAILABLE rather than license for shell-policy bypass."
    - "Add focused doctrine regressions in scripts/test_validate_skill_library.py covering at least: provider-specific handoff must not override capability routing absent material binding; typed bounded publication is preferred over generic shell when equivalent; generic terminal remains legal fallback; platform block forbids bypass/obfuscation/retry spam; verification quality cannot be downgraded by fallback; immutable publication handoff preserves exact object and one-writer semantics; exact-commit and content-identity publication contracts are distinct; operator fallback remains last-resort explicit consequence; same-commit report publication is externally proven rather than self-attested."
    - "Keep the correction protocol-v3 compatible and version-agnostic. Do not encode current OpenAI internal safety-rule names, hidden classifiers, plan-specific product behavior, current UI wording, current connector inventory, or transient command-specific allow/deny observations as reusable doctrine."
    - "Run repository-native validation and the complete relevant unit-test suites, publish the implementation candidate to dev, publish a report-only direct child, fresh-resolve canonical remote closure, and stop at NEEDS_REVIEW."

