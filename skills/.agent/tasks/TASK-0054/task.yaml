invariants:
  - "Exactly two organizational roles remain Architect and Executor."
  - "Capability routing is semantic and authority-first; provider/tool identity is not authority by itself."
  - "No rule or implementation may attempt to evade, bypass, obfuscate around, or weaken platform safety controls."
  - "Typed/bounded actions are preferred only when consequence and proof are equivalent; they do not manufacture authority or automatically imply safety."
  - "Generic terminal remains available as a bounded fallback when sufficient, authorized, and permitted."
  - "Verification and acceptance quality MUST NOT be weakened because a preferred execution surface is unavailable."
  - "One-writer remains exact for active content mutation; immutable publication handoff is transfer of publication authority over an already-fixed object/content identity, not concurrent editing."
  - "GitHub remote remains canonical repository truth; remote mutable evidence is refreshed at consequence boundaries."
  - "No new lifecycle state, role, scheduler, queue, registry, transaction service, publication daemon, provider router service, or cross-repository lock is introduced."
  - "Historical artifacts remain valid; no bulk backfill or migration is required."

forbidden_changes:
  - "Do not modify templates or validator parsing/schema unless the existing serialization cannot express the required semantics; if that becomes necessary, stop as BLOCKING rather than expanding scope."
  - "Do not modify reuse-first, other skills, README taxonomy, case router, dependencies, workflows, branch topology, main, tags, releases, or sibling repositories."
  - "Do not add vendor-specific OpenAI policy text as repository authority, hidden safety assumptions, command allowlists, provider score/ranking systems, or automatic provider hopping machinery."
  - "Do not add a repo_publish runtime tool, Agent Runtime implementation, MCP server code, confirmation UI, Secure MCP Tunnel change, or runtime lifecycle change in this task."
  - "Do not weaken one-writer, exact-base, fresh-remote, verifier, report/review, promotion, or release boundaries."
  - "Do not use platform safety blocks as justification to widen permissions, disable safety, encode/obfuscate commands, or split consequences to evade review."

