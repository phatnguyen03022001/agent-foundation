      required: true
    - id: CHECK-4
      command_or_check: "Run full repository-native validator/test checks and git diff --check on the exact implementation candidate."
      required: true
    - id: CHECK-5
      command_or_check: "Prove exact implementation diff stays inside authorized files, publish candidate non-force to dev, create/validate report-only direct child, publish it, fresh-resolve remote dev/main and stop at NEEDS_REVIEW."
      required: true
