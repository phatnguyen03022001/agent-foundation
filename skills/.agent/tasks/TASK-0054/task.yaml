acceptance_criteria:
  - id: AC-1
    requirement: "Execution routing is semantic-capability-first and does not accidentally bind to SentinelX, Remote Desktop Commander, Agent Runtime, shell, or another provider unless exact surface identity is materially required."
    evidence_required: "Protocol/role text plus focused regression proves provider-specific handoff wording cannot override an otherwise provider-neutral canonical task."
  - id: AC-2
    requirement: "Equivalent canonical mutation prefers the narrowest explicit bounded/typed consequence action while preserving generic terminal as an authorized fallback."
    evidence_required: "Protocol/Executor semantics and regression distinguish typed consequence preference from terminal prohibition and preserve authority/proof equivalence."
  - id: AC-3
    requirement: "Platform/tool safety refusal is fail-closed capability evidence and never triggers bypass behavior."
    evidence_required: "Regression rejects obfuscation, command splitting for evasion, permission widening, or repeated unchanged retries and routes to existing capability-unavailable/rebind/operator semantics."
  - id: AC-4
    requirement: "Fallback or surface changes never weaken proof quality."
    evidence_required: "Canonical semantics explicitly preserve ACs, exact identity, verifier requirements, remote freshness and evidence obligations regardless of surface."
  - id: AC-5
    requirement: "Immutable publication handoff allows progress without violating one-writer."
    evidence_required: "Regression proves prior writer terminal + exact immutable checkpoint + explicit publication authority transfer permits successor publication but forbids content edit/amend/recreation without new authority."
  - id: AC-6
    requirement: "Exact-commit publication and content-identity publication remain distinct contracts."
    evidence_required: "Regression proves an exact local SHA cannot silently be replaced by a newly created equivalent-content commit; content-identity publication may use a different SHA only when task authority explicitly permits it."
  - id: AC-7
    requirement: "Operator fallback is explicit and bounded, not a default manual RPC path."
    evidence_required: "Semantics require current automation insufficiency/user-only action plus preserved pre/post consequence evidence before operator execution."
  - id: AC-8
    requirement: "Report and review publication remain externally proven consequences rather than self-attested same-commit facts."
    evidence_required: "Report/review contract wording and regressions preserve post-publication REMOTE_MUTABLE proof and truthful non-durable terminal behavior."
  - id: AC-9
    requirement: "The correction remains protocol-v3 compatible and architecture-minimal."
    evidence_required: "Exact candidate diff stays within authorized semantic owners/tests, adds no role/state/framework/router/service/schema migration and requires no historical backfill."
  - id: AC-10
    requirement: "Current official OpenAI write-action safety guidance is freshly researched without freezing mutable product details into generic doctrine."
    evidence_required: "Report records authoritative official-source URLs/date observed and maps only durable consequences into vendor-neutral repository wording."
  - id: AC-11
    requirement: "All relevant repository-native validation passes on the exact candidate."
    evidence_required: "python3 scripts/validate_skill_library.py; python3 -m unittest scripts/test_validate_skill_library.py; python3 -m unittest scripts.test_reconcile_env; git diff --check; canonical TASK-0054 task/report artifact validation all PASS."

