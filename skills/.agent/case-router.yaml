    capabilities:
      - executor
    navigation: none
  - id: IMPLEMENT
    specialist: implementer
    binding: target
    capabilities:
      - executor
    navigation: none
  - id: DESIGN
    specialist: architect
    binding: target
    capabilities:
      - architect
    navigation: none
  - id: REVIEW
    specialist: reviewer
    binding: target
    capabilities:
      - verification
    navigation: none
  - id: SECURITY
    specialist: security_reviewer
    binding: target
    capabilities:
      - security_review
    navigation: none
  - id: RELEASE
    specialist: release_operator
    binding: target
    capabilities:
      - executor
      - task_protocol
    navigation: none
